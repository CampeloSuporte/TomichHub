{% load static %}
<!--
  ABA MONITORAMENTO — tab_monitoramento.html
  Versão simplificada: apenas Gráficos de Tráfego + Config Zabbix API.
-->

<script>
  window.CLIENTE_ID = "{{ cliente.id }}";

  var _zbxCfg = {
    zbxSalvar: '/monitoramento/zabbix/salvar/',
    zbxBuscar: '/monitoramento/zabbix/buscar/',
    zbxTestar: '/monitoramento/zabbix/testar/',
  };

  function _csrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  window.grphAbrirAdd = function() {
    if (window.GRAPH && typeof window.GRAPH.abrirModalAdd === 'function') {
      window.GRAPH.abrirModalAdd();
    }
  };

  window.grphAbrirZabbix = function() {
    var modal = document.getElementById('grph-modal-zabbix');
    if (!modal) return;
    var res = document.getElementById('grph-zbx-result');
    if (res) res.style.display = 'none';
    var p = document.getElementById('grph-zbx-pass');   if (p) p.value = '';
    var t = document.getElementById('grph-zbx-token');  if (t) t.value = '';
    modal.style.display = 'flex';
    fetch(_zbxCfg.zbxBuscar + '?id=' + window.CLIENTE_ID)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.existe) {
          var u = document.getElementById('grph-zbx-url');
          var usr = document.getElementById('grph-zbx-user');
          if (u) u.value = d.url || '';
          if (usr) usr.value = d.usuario || '';
        }
      })
      .catch(function(e){ console.warn('[GRAPH] zbxBuscar:', e); });
  };

  window.grphFecharZabbix = function() {
    var m = document.getElementById('grph-modal-zabbix');
    if (m) m.style.display = 'none';
  };

  window.grphTestar = function() {
    var res = document.getElementById('grph-zbx-result');
    if (!res) return;
    res.textContent = 'Testando conexão...'; res.className = 'grph-alert'; res.style.display = 'block';
    fetch(_zbxCfg.zbxTestar + '?id=' + window.CLIENTE_ID)
      .then(function(r){ return r.json(); })
      .then(function(d){ res.textContent = d.message; res.className = 'grph-alert ' + (d.success ? 'success' : 'error'); })
      .catch(function(e){ res.textContent = 'Erro: ' + e.message; res.className = 'grph-alert error'; });
  };

  window.grphSalvarZabbix = function() {
    var fd = new FormData();
    fd.append('cliente',   window.CLIENTE_ID);
    fd.append('url',       (document.getElementById('grph-zbx-url')   ||{}).value||'');
    fd.append('usuario',   (document.getElementById('grph-zbx-user')  ||{}).value||'');
    fd.append('senha',     (document.getElementById('grph-zbx-pass')  ||{}).value||'');
    fd.append('api_token', (document.getElementById('grph-zbx-token') ||{}).value||'');
    fetch(_zbxCfg.zbxSalvar, { method:'POST', headers:{'X-CSRFToken':_csrf()}, body:fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var res = document.getElementById('grph-zbx-result');
        if (!res) return;
        res.textContent = d.message || (d.success ? 'Salvo!' : 'Erro ao salvar');
        res.className = 'grph-alert ' + (d.success ? 'success' : 'error');
        res.style.display = 'block';
      })
      .catch(function(e){
        var res = document.getElementById('grph-zbx-result');
        if (res){ res.textContent='Erro: '+e.message; res.className='grph-alert error'; res.style.display='block'; }
      });
  };

  window.grphSetLayout = function(l) {
    var g = document.getElementById('grph-grid');
    if (!g) return;
    g.classList.toggle('grph-layout-list', l === 'list');
    var bg = document.getElementById('grph-layout-grid');
    var bl = document.getElementById('grph-layout-list');
    if (bg) bg.classList.toggle('active', l === 'grid');
    if (bl) bl.classList.toggle('active', l === 'list');
  };

  window.grphAtualizar = function() {
    if (window.GRAPH && typeof window.GRAPH.atualizarTodos === 'function') window.GRAPH.atualizarTodos();
  };

  window.grphFecharModal = function() {
    if (window.GRAPH && typeof window.GRAPH.fecharModal === 'function') window.GRAPH.fecharModal();
  };

  window.grphSalvarChart = function() {
    if (window.GRAPH && typeof window.GRAPH.salvarChart === 'function') window.GRAPH.salvarChart();
  };

  window.grphHostSearch = function(v) {
    if (window.GRAPH && typeof window.GRAPH.hostSearchDebounce === 'function') window.GRAPH.hostSearchDebounce(v);
  };

  window.grphIfaceChange = function() {
    if (window.GRAPH && typeof window.GRAPH.ifaceChange === 'function') window.GRAPH.ifaceChange();
  };

  window.grphFiltrarIfaces = function(v) {
    if (!window.GRAPH) return;
    var hostid = document.getElementById('grph-m-hostid') && document.getElementById('grph-m-hostid').value;
    var cache  = window.GRAPH._ifacesCache;
    var ifaces = cache && hostid ? cache[hostid] : null;
    if (!ifaces) return;
    window.GRAPH._renderIfaceList(ifaces, v);
  };

  window.grphSelecionarIface = function(name, inId, outId) {
    var val  = document.getElementById('grph-m-iface-val');
    var inp  = document.getElementById('grph-m-iface-search');
    var list = document.getElementById('grph-m-iface-list');
    var prev = document.getElementById('grph-m-preview');

    if (val)  val.value = JSON.stringify({ iface: name, inId: inId || null, outId: outId || null });
    if (inp)  inp.value = name;
    if (list) list.style.display = 'none';

    if (prev) {
      var inHtml  = inId  ? '<b style="color:#00ff88">'  + inId  + '</b>' : '<span style="color:#64748b">—</span>';
      var outHtml = outId ? '<b style="color:#00d9ff">'  + outId + '</b>' : '<span style="color:#64748b">—</span>';
      prev.style.display = 'block';
      prev.innerHTML =
        '<div class="grph-preview-row"><span>In Item ID</span>'  + inHtml  + '</div>' +
        '<div class="grph-preview-row"><span>Out Item ID</span>' + outHtml + '</div>';
    }
  };
</script>


<!-- ═══════════════════════════════════════════════════════
     ABA MONITORAMENTO
════════════════════════════════════════════════════════ -->
<div id="tab-monitoramento" class="tab-content-main" style="display:none;">

  <!-- ── TOOLBAR ──────────────────────────────────────────── -->
  <div class="grph-toolbar">
    <div class="grph-toolbar-left">
      <div class="grph-toolbar-brand">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <polyline points="2 17 7 12 11 15 16 9 22 12"
                    stroke="#00ff88" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 20h20" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Monitor de Tráfego</span>
      </div>

      <button class="grph-btn grph-btn-primary" onclick="grphAbrirAdd()">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Adicionar
      </button>

      <button class="grph-btn" onclick="grphAtualizar()" title="Forçar atualização de todos">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        Atualizar
      </button>
    </div>

    <div class="grph-toolbar-right">
      <div class="grph-live-pill">
        <span class="grph-live-dot"></span>
        <span>LIVE</span>
        <span class="grph-live-interval">15s</span>
      </div>

      <div class="grph-layout-toggle">
        <button class="grph-layout-btn active" id="grph-layout-grid"
                onclick="grphSetLayout('grid')" title="Grade">
          <svg viewBox="0 0 24 24" width="13" height="13">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
        <button class="grph-layout-btn" id="grph-layout-list"
                onclick="grphSetLayout('list')" title="Lista">
          <svg viewBox="0 0 24 24" width="13" height="13">
            <rect x="3" y="4" width="18" height="5" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="3" y="13" width="18" height="5" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
      </div>

      <button class="grph-btn grph-btn-ghost" onclick="grphAbrirZabbix()" title="Configurar Zabbix API">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M19.07 4.93A10 10 0 1 1 4.93 19.07" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        Zabbix API
      </button>
    </div>
  </div>

  <!-- ── GRID DE GRÁFICOS ─────────────────────────────────── -->
  <div id="grph-grid" class="grph-grid"></div>

</div><!-- /#tab-monitoramento -->


<!-- ═══════════════════════════════════════════════════════
     MODAL: ADICIONAR / EDITAR MONITOR
════════════════════════════════════════════════════════ -->
<div id="grph-modal" class="grph-overlay" style="display:none;">
  <div class="grph-modal">
    <div class="grph-modal-header">
      <div class="grph-modal-title-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <polyline points="2 17 7 12 11 15 16 9 22 12"
                    stroke="#00ff88" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3 id="grph-modal-title">Adicionar Monitor</h3>
      </div>
      <button class="grph-modal-close" onclick="grphFecharModal()">✕</button>
    </div>

    <div class="grph-modal-body">
      <label class="grph-label">Host Zabbix *</label>
      <div class="grph-search-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" class="grph-search-icon">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="grph-m-search" type="text" class="grph-input grph-input-search"
               placeholder="Buscar host pelo nome ou IP…"
               oninput="grphHostSearch(this.value)"/>
      </div>
      <div id="grph-m-results" class="grph-search-results" style="display:none;"></div>
      <div id="grph-m-badge"   class="grph-host-badge"    style="display:none;"></div>
      <input type="hidden" id="grph-m-hostid"/>
      <input type="hidden" id="grph-m-hostname"/>

      <!-- ── TÍTULO PERSONALIZADO ─────────────────────── -->
      <label class="grph-label" style="margin-top:18px;">
        Título do gráfico
        <span class="grph-badge-optional">opcional</span>
      </label>
      <div class="grph-input-icon-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" class="grph-input-icon">
          <path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <input id="grph-m-titulo" type="text" class="grph-input grph-input-icon-pad"
               placeholder="Ex: Link Cliente ABC — 100Mbps"/>
      </div>
      <p class="grph-hint">Exibido no lugar do nome do host no cabeçalho do card. Deixe vazio para usar o nome do host.</p>

      <label class="grph-label" style="margin-top:18px;">Interface / Item *</label>
      <div class="grph-search-wrap" id="grph-iface-wrap" style="display:none;">
        <svg viewBox="0 0 24 24" width="14" height="14" class="grph-search-icon">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="grph-m-iface-search" type="text" class="grph-input grph-input-search"
               placeholder="Filtrar interfaces… (ex: GigabitEthernet, vlan)"
               oninput="grphFiltrarIfaces(this.value)"/>
      </div>
      <div id="grph-m-iface-list" class="grph-search-results" style="display:none; max-height:240px;"></div>
      <input type="hidden" id="grph-m-iface-val"/>
      <p class="grph-hint">Interfaces com ↓↑ têm itens In+Out detectados automaticamente.</p>

      <div id="grph-m-preview" class="grph-preview-box" style="display:none;"></div>
    </div>

    <div class="grph-modal-footer">
      <button class="grph-btn grph-btn-ghost" onclick="grphFecharModal()">Cancelar</button>
      <button class="grph-btn grph-btn-primary" onclick="grphSalvarChart()">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        Confirmar
      </button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     MODAL: ZABBIX API
════════════════════════════════════════════════════════ -->
<div id="grph-modal-zabbix" class="grph-overlay" style="display:none;">
  <div class="grph-modal">
    <div class="grph-modal-header">
      <div class="grph-modal-title-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="3" stroke="#00d9ff" stroke-width="2" fill="none"/>
          <path d="M19.07 4.93A10 10 0 1 1 4.93 19.07" stroke="#00d9ff" stroke-width="2" fill="none"/>
        </svg>
        <h3>Configuração Zabbix API</h3>
      </div>
      <button class="grph-modal-close" onclick="grphFecharZabbix()">✕</button>
    </div>

    <div class="grph-modal-body">
      <label class="grph-label">URL do Zabbix *</label>
      <input id="grph-zbx-url" type="url" class="grph-input"
             placeholder="https://zabbix.empresa.com"/>
      <p class="grph-hint">Não inclua <code>/api_jsonrpc.php</code></p>

      <label class="grph-label" style="margin-top:14px;">
        Token de API
        <span class="grph-badge">Zabbix 5.4+</span>
      </label>
      <input id="grph-zbx-token" type="password" class="grph-input"
             placeholder="Deixe vazio para usar usuário/senha"/>

      <div class="grph-two-col" style="margin-top:14px;">
        <div>
          <label class="grph-label">Usuário</label>
          <input id="grph-zbx-user" type="text" class="grph-input" placeholder="Admin"/>
        </div>
        <div>
          <label class="grph-label">Senha</label>
          <input id="grph-zbx-pass" type="password" class="grph-input" placeholder="••••••••"/>
        </div>
      </div>

      <div id="grph-zbx-result" class="grph-alert" style="display:none;"></div>
    </div>

    <div class="grph-modal-footer">
      <button class="grph-btn grph-btn-ghost" onclick="grphTestar()">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        Testar
      </button>
      <button class="grph-btn grph-btn-primary" onclick="grphSalvarZabbix()">Salvar</button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     ESTILOS
════════════════════════════════════════════════════════ -->
<style>
/* ── Reset ────────────────────────────────────────────── */
#tab-monitoramento * { box-sizing: border-box; }
#tab-monitoramento {
  display: flex; flex-direction: column;
  height: calc(100vh - 130px); min-height: 600px;
  background: #080f1a; border-radius: 10px; overflow: hidden;
}

/* ── Toolbar ──────────────────────────────────────────── */
.grph-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; flex-shrink: 0; gap: 10px; flex-wrap: wrap;
  background: linear-gradient(180deg, #0d1829 0%, #0a1520 100%);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.grph-toolbar-left, .grph-toolbar-right {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.grph-toolbar-brand {
  display: flex; align-items: center; gap: 8px;
  font-size: .82rem; font-weight: 700; color: #e2e8f0;
  letter-spacing: .3px; padding-right: 12px;
  border-right: 1px solid rgba(255,255,255,0.08);
}

/* ── Live pill ────────────────────────────────────────── */
.grph-live-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,255,136,0.07);
  border: 1px solid rgba(0,255,136,0.2);
  border-radius: 20px; padding: 4px 10px;
  font-size: .7rem; font-weight: 700; color: #00ff88;
  letter-spacing: .5px;
}
.grph-live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #00ff88; animation: grph-blink 1.3s ease-in-out infinite;
}
.grph-live-interval { color: #334155; font-weight: 400; font-size: .68rem; }
@keyframes grph-blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── Layout toggle ────────────────────────────────────── */
.grph-layout-toggle {
  display: flex; background: #0a1520;
  border: 1px solid #1e293b; border-radius: 6px; padding: 2px;
}
.grph-layout-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: none; border-radius: 4px;
  background: transparent; color: #475569; cursor: pointer; transition: all .15s;
}
.grph-layout-btn.active { background: #1e293b; color: #e2e8f0; }
.grph-layout-btn:hover:not(.active) { color: #94a3b8; }

/* ── Buttons ──────────────────────────────────────────── */
.grph-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 7px;
  font-size: .78rem; font-weight: 500; cursor: pointer;
  border: 1px solid #1e293b; background: #0d1829; color: #94a3b8;
  transition: all .15s; letter-spacing: .2px;
}
.grph-btn:hover { background: #1e293b; border-color: #334155; color: #e2e8f0; }
.grph-btn-primary {
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  border-color: #3b82f6; color: #fff;
}
.grph-btn-primary:hover { background: linear-gradient(135deg, #2563eb, #3b82f6); }
.grph-btn-ghost { background: transparent; }
.grph-btn-ghost:hover { background: #0d1829; }

/* ── Grid ─────────────────────────────────────────────── */
.grph-grid {
  flex: 1; overflow-y: auto; padding: 18px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
  gap: 18px; align-content: start; background: #080f1a;
}
.grph-grid.grph-layout-list {
  grid-template-columns: 1fr;
}

/* ── Empty state ──────────────────────────────────────── */
.grph-empty {
  grid-column: 1/-1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; padding: 80px 20px; text-align: center;
}
.grph-empty-icon {
  width: 120px; height: 80px; display: flex;
  align-items: center; justify-content: center;
  background: rgba(59,130,246,.04);
  border: 1px solid rgba(59,130,246,.1);
  border-radius: 16px; padding: 16px;
}
.grph-empty-title {
  margin: 0; font-size: 1.05rem; font-weight: 700;
  color: #e2e8f0; letter-spacing: .2px;
}
.grph-empty-sub { margin: 0; font-size: .82rem; color: #475569; max-width: 320px; line-height: 1.5; }

/* ── Card ─────────────────────────────────────────────── */
.grph-card {
  background: #0d1829;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
  transition: border-color .2s, box-shadow .2s;
  position: relative;
}
.grph-card:hover {
  border-color: rgba(59,130,246,.25);
  box-shadow: 0 0 0 1px rgba(59,130,246,.08), 0 8px 32px rgba(0,0,0,.3);
}
.grph-card-glow {
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,255,136,.3), rgba(0,217,255,.3), transparent);
  opacity: 0; transition: opacity .2s;
}
.grph-card:hover .grph-card-glow { opacity: 1; }

/* ── Card header ──────────────────────────────────────── */
.grph-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  background: rgba(255,255,255,0.015);
}
.grph-card-info { display: flex; flex-direction: column; gap: 3px; }
.grph-card-title-row { display: flex; align-items: center; gap: 8px; }
.grph-poll-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #1e293b; border: 1px solid #334155;
  transition: background .3s, border-color .3s;
  flex-shrink: 0;
}
.grph-poll-dot.pulsing {
  background: #00ff88; border-color: #00ff88;
  animation: grph-blink .6s ease-in-out 3;
}
.grph-poll-dot.grph-dot-active {
  background: rgba(0,255,136,.3); border-color: rgba(0,255,136,.6);
}
.grph-host {
  font-size: .85rem; font-weight: 700; color: #e2e8f0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px;
}
/* Hostname secundário (quando há título personalizado) */
.grph-host-sub {
  font-size: .68rem; color: #334155; font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px;
  display: flex; align-items: center; gap: 4px; margin-top: 1px;
}
.grph-iface { font-size: .7rem; color: #475569; display: flex; align-items: center; }

     SCRIPTS

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
'use strict';

const GRAPH = (() => {

  // ── Estado ────────────────────────────────────────────────
  let clienteId     = null;
  let charts        = [];
  let nextChartId   = 1;
  let ifacesCache   = {};
  let _hostTimer    = null;
  let _editingChart = null;
  let _fullscreenId = null;

  /* ── Persistência localStorage ────────────────────────── */
  function _storageKey() {
    return 'grph_charts_' + (window.CLIENTE_ID || 'default');
  }

  function _salvarStorage() {
    try {
      const data = charts.map(c => ({
        id:        c.id,
        hostid:    c.hostid,
        hostname:  c.hostname,
        titulo:    c.titulo  || '',   // ← título personalizado
        ifaceName: c.ifaceName,
        inId:      c.inId,
        outId:     c.outId,
        hours:     c.hours || 1,
      }));
      localStorage.setItem(_storageKey(), JSON.stringify(data));
      localStorage.setItem(_storageKey() + '_nextId', String(nextChartId));
    } catch(e) { console.warn('[GRAPH] localStorage write error:', e); }
  }

  function _carregarStorage() {
    try {
      const raw = localStorage.getItem(_storageKey());
      const nid = localStorage.getItem(_storageKey() + '_nextId');
      if (nid) nextChartId = parseInt(nid) || 1;
      if (!raw) return;
      const data = JSON.parse(raw);
      charts = data.map(c => ({
        ...c,
        titulo:        c.titulo  || '',   // ← restaura título
        hours:         c.hours || 1,
        chartInstance: null, fsChartInstance: null,
        _interval:     null, _fsSync: false,
      }));
    } catch(e) { console.warn('[GRAPH] localStorage read error:', e); }
  }

  // ── Paleta ────────────────────────────────────────────────
  const C = {
    in:      '#00ff88',
    out:     '#00d9ff',
    inFill:  'rgba(0,255,136,0.08)',
    outFill: 'rgba(0,217,255,0.08)',
    grid:    'rgba(255,255,255,0.04)',
    text:    '#475569',
    border:  '#1e293b',
  };

  const URLS = {
    zbxHosts:  '/monitoramento/zabbix/hosts/',
    zbxIfaces: '/monitoramento/zabbix/interfaces/',
    history:   '/monitoramento/zabbix/history/',
  };

  async function _get(url) {
    const r = await fetch(url);
    return r.json();
  }

  // ─────────────────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────────────────
  function init() {
    clienteId = window.CLIENTE_ID || null;
    _carregarStorage();
    _renderGrid();
    _bindKeyboard();
  }

  function _bindKeyboard() {
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && _fullscreenId !== null) fecharFullscreen();
    });
  }

  // ─────────────────────────────────────────────────────────
  // GRID
  // ─────────────────────────────────────────────────────────
  function _renderGrid() {
    const grid = document.getElementById('grph-grid');
    if (!grid) return;
    grid.innerHTML = '';

    if (charts.length === 0) {
      grid.innerHTML = _emptyState();
      return;
    }

    charts.forEach(c => {
      const card = document.createElement('div');
      card.className = 'grph-card';
      card.id = `grph-card-${c.id}`;
      card.innerHTML = _cardHTML(c);
      grid.appendChild(card);
      _initChart(c);
    });
  }

  function _emptyState() {
    return `
      <div class="grph-empty">
        <div class="grph-empty-icon">
          <svg viewBox="0 0 120 80" width="120" height="80">
            <defs>
              <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00ff88" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#00d9ff" stop-opacity="0.4"/>
              </linearGradient>
            </defs>
            <rect x="4"  y="50" width="16" height="26" rx="3" fill="url(#emptyGrad)" opacity=".5"/>
            <rect x="26" y="32" width="16" height="44" rx="3" fill="url(#emptyGrad)" opacity=".6"/>
            <rect x="48" y="40" width="16" height="36" rx="3" fill="url(#emptyGrad)" opacity=".7"/>
            <rect x="70" y="20" width="16" height="56" rx="3" fill="url(#emptyGrad)" opacity=".8"/>
            <rect x="92" y="10" width="16" height="66" rx="3" fill="url(#emptyGrad)"/>
            <polyline points="12,45 34,28 56,36 78,16 100,6"
                      stroke="#3b82f6" stroke-width="2" fill="none"
                      stroke-dasharray="4,3" stroke-linecap="round"/>
          </svg>
        </div>
        <h3 class="grph-empty-title">Nenhum gráfico configurado</h3>
        <p class="grph-empty-sub">Adicione interfaces Zabbix para monitorar tráfego em tempo real.</p>
        <button class="grph-btn grph-btn-primary" onclick="window.GRAPH.abrirModalAdd()">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          Adicionar Monitor
        </button>
      </div>`;
  }

  function _cardHTML(c) {
    const hours = c.hours || 1;
    const periodBtns = [1, 3, 6, 12, 24].map(h =>
      `<button class="grph-period-btn ${h === hours ? 'active' : ''}"
               onclick="GRAPH.setPeriod(${c.id}, ${h})">${h}h</button>`
    ).join('');

    // Título exibido = título personalizado (se definido) ou hostname
    const displayTitle = c.titulo || c.hostname || '—';
    // Se há título personalizado, mostra o hostname como info secundária
    const subHostHtml = c.titulo
      ? `<span class="grph-host-sub">
           <svg viewBox="0 0 24 24" width="9" height="9" style="opacity:.4;flex-shrink:0">
             <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
             <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
           </svg>
           ${c.hostname || ''}
         </span>`
      : '';

    return `
      <div class="grph-card-glow"></div>
      <div class="grph-card-header">
        <div class="grph-card-info">
          <div class="grph-card-title-row">
            <span class="grph-poll-dot" id="grph-dot-${c.id}"></span>
            <span class="grph-host" title="${c.hostname || ''}">${displayTitle}</span>
          </div>
          ${subHostHtml}
          <span class="grph-iface">
            <svg viewBox="0 0 24 24" width="10" height="10" style="margin-right:3px;opacity:.5">
              <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            ${c.ifaceName || '—'}
          </span>
        </div>
        <div class="grph-card-acts">
          <button class="grph-icon-btn" onclick="GRAPH.toggleFullscreen(${c.id})" title="Expandir">
            <svg viewBox="0 0 24 24" width="13" height="13">
              <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"
                    stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="grph-icon-btn" onclick="GRAPH.abrirModalEdit(${c.id})" title="Editar">
            <svg viewBox="0 0 24 24" width="13" height="13">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                    stroke="currentColor" stroke-width="2" fill="none"/>
              <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"
                    stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </button>
          <button class="grph-icon-btn grph-danger" onclick="GRAPH.removerChart(${c.id})" title="Remover">
            <svg viewBox="0 0 24 24" width="13" height="13">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="grph-stats-row">
        <div class="grph-stat-block grph-stat-in">
          <span class="grph-stat-arrow">↓</span>
          <div>
            <div class="grph-stat-val" id="grph-in-${c.id}">—</div>
            <div class="grph-stat-label">Download</div>
          </div>
        </div>
        <div class="grph-stat-divider"></div>
        <div class="grph-stat-block grph-stat-out">
          <span class="grph-stat-arrow">↑</span>
          <div>
            <div class="grph-stat-val" id="grph-out-${c.id}">—</div>
            <div class="grph-stat-label">Upload</div>
          </div>
        </div>
        <div class="grph-stat-divider"></div>
        <div class="grph-stat-block grph-stat-peak">
          <svg viewBox="0 0 24 24" width="12" height="12" style="opacity:.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <div>
            <div class="grph-stat-val" id="grph-peak-${c.id}">—</div>
            <div class="grph-stat-label">Pico (${hours}h)</div>
          </div>
        </div>
      </div>

      <div class="grph-canvas-wrap">
        <canvas id="grph-cv-${c.id}"></canvas>
      </div>

      <div class="grph-footer">
        <span class="grph-ts" id="grph-ts-${c.id}">Aguardando dados...</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="grph-period-sel" id="grph-period-${c.id}">${periodBtns}</div>
          <span class="grph-interval">
            <span class="grph-interval-dot"></span>
            15s
          </span>
        </div>
      </div>`;
  }

  // ─────────────────────────────────────────────────────────
  // CHART.JS
  // ─────────────────────────────────────────────────────────
  function _chartConfig(mini = false) {
    return {
      type: 'line',
      data: { labels: [], datasets: [
        {
          label: 'Download ↓', data: [],
          borderColor: C.in, backgroundColor: C.inFill,
          borderWidth: mini ? 1.5 : 2, pointRadius: 0,
          fill: true, tension: 0.4,
          spanGaps: true,
        },
        {
          label: 'Upload ↑', data: [],
          borderColor: C.out, backgroundColor: C.outFill,
          borderWidth: mini ? 1.5 : 2, pointRadius: 0,
          fill: true, tension: 0.4,
          spanGaps: true,
        },
      ]},
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            display: !mini,
            labels: { color: '#64748b', font: { size: 10 }, boxWidth: 10, padding: 12 },
          },
          tooltip: {
            backgroundColor: '#0f172a',
            borderColor: '#334155',
            borderWidth: 1,
            titleColor: '#e2e8f0',
            bodyColor: '#94a3b8',
            padding: 12,
            cornerRadius: 8,
            callbacks: { label: ctx => `  ${ctx.dataset.label}: ${_fmtBps(ctx.raw)}` },
          },
        },
        scales: {
          x: {
            display: !mini,
            ticks: { color: C.text, font: { size: 9 }, maxRotation: 0, maxTicksLimit: 8 },
            grid: { color: C.grid },
            border: { color: 'transparent' },
          },
          y: {
            min: 0,
            display: !mini,
            ticks: { color: C.text, font: { size: 9 }, callback: v => _fmtBps(v) },
            grid: { color: C.grid },
            border: { color: 'transparent' },
          },
        },
      },
    };
  }

  function _initChart(c) {
    const canvas = document.getElementById(`grph-cv-${c.id}`);
    if (!canvas) return;

    if (typeof Chart === 'undefined') {
      canvas.parentElement.innerHTML =
        '<p style="color:#475569;text-align:center;padding:24px;font-size:.78rem;">Chart.js não encontrado.</p>';
      return;
    }

    c.chartInstance = new Chart(canvas, _chartConfig(false));
    _startPolling(c);
  }

  // ─────────────────────────────────────────────────────────
  // PERÍODO
  // ─────────────────────────────────────────────────────────
  function setPeriod(id, hours) {
    const c = charts.find(x => x.id === id);
    if (!c) return;
    c.hours = hours;

    const peakLabel = document.querySelector(`#grph-card-${id} .grph-stat-peak .grph-stat-label`);
    if (peakLabel) peakLabel.textContent = `Pico (${hours}h)`;

    const sel = document.getElementById(`grph-period-${id}`);
    if (sel) sel.querySelectorAll('.grph-period-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.textContent) === hours);
    });

    _salvarStorage();
    _fetchHistory(c);
  }

  // ─────────────────────────────────────────────────────────
  // FULLSCREEN
  // ─────────────────────────────────────────────────────────
  function toggleFullscreen(id) {
    if (_fullscreenId === id) { fecharFullscreen(); return; }
    _fullscreenId = id;
    const c = charts.find(x => x.id === id);
    if (!c) return;

    let overlay = document.getElementById('grph-fullscreen-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'grph-fullscreen-overlay';
      overlay.className = 'grph-fullscreen-overlay';
      overlay.onclick = e => { if (e.target === overlay) fecharFullscreen(); };
      document.body.appendChild(overlay);
    }

    const hours = c.hours || 1;
    const fsPeriodBtns = [1, 3, 6, 12, 24].map(h =>
      `<button class="grph-period-btn ${h === hours ? 'active' : ''}"
               onclick="GRAPH.setFsPeriod(${c.id}, ${h})" style="font-size:.72rem;padding:3px 9px;">${h}h</button>`
    ).join('');

    // No fullscreen: título = título personalizado (se definido) ou hostname
    const fsTitle = c.titulo || c.hostname || '—';
    // Sub-linha: se há título, mostra hostname; senão mostra a interface
    const fsSub   = c.titulo
      ? `${c.hostname || ''} &nbsp;·&nbsp; ${c.ifaceName || ''}`
      : (c.ifaceName || '—');

    overlay.innerHTML = `
      <div class="grph-fullscreen-modal">
        <div class="grph-fullscreen-header">
          <div>
            <h2 class="grph-fullscreen-title">${fsTitle}</h2>
            <p class="grph-fullscreen-sub">${fsSub}</p>
          </div>
          <div class="grph-fullscreen-actions">
            <div class="grph-period-sel" id="grph-fs-period" style="margin-right:8px;">${fsPeriodBtns}</div>
            <div class="grph-fs-stats">
              <span class="grph-fs-stat-in" id="grph-fs-in">↓ —</span>
              <span class="grph-fs-stat-out" id="grph-fs-out">↑ —</span>
            </div>
            <button class="grph-icon-btn" onclick="GRAPH.fecharFullscreen()" title="Fechar">
              <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="grph-fullscreen-canvas-wrap">
          <canvas id="grph-fs-canvas"></canvas>
        </div>
        <div class="grph-fullscreen-footer">
          <span id="grph-fs-ts">—</span>
        </div>
      </div>`;

    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    if (typeof Chart !== 'undefined') {
      const fsCanvas = document.getElementById('grph-fs-canvas');
      c.fsChartInstance = new Chart(fsCanvas, _chartConfig(false));

      if (c.chartInstance) {
        c.fsChartInstance.data = JSON.parse(JSON.stringify(c.chartInstance.data));
        c.fsChartInstance.update('none');
      }
      c._fsSync = true;
    }

    _updateFsStats(c);
  }

  function fecharFullscreen() {
    const c = charts.find(x => x.id === _fullscreenId);
    if (c) {
      c._fsSync = false;
      if (c.fsChartInstance) { c.fsChartInstance.destroy(); c.fsChartInstance = null; }
    }
    const overlay = document.getElementById('grph-fullscreen-overlay');
    if (overlay) overlay.style.display = 'none';
    document.body.style.overflow = '';
    _fullscreenId = null;
  }

  function setFsPeriod(id, hours) {
    const sel = document.getElementById('grph-fs-period');
    if (sel) sel.querySelectorAll('.grph-period-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.textContent) === hours);
    });
    setPeriod(id, hours);
  }

  function _updateFsStats(c) {
    const elIn  = document.getElementById('grph-fs-in');
    const elOut = document.getElementById('grph-fs-out');
    const elTs  = document.getElementById('grph-fs-ts');
    const srcIn  = document.getElementById(`grph-in-${c.id}`);
    const srcOut = document.getElementById(`grph-out-${c.id}`);
    const srcTs  = document.getElementById(`grph-ts-${c.id}`);
    if (elIn  && srcIn)  elIn.textContent  = '↓ ' + (srcIn.textContent  || '—');
    if (elOut && srcOut) elOut.textContent = '↑ ' + (srcOut.textContent || '—');
    if (elTs  && srcTs)  elTs.textContent  = srcTs.textContent;
  }

  // ─────────────────────────────────────────────────────────
  // POLLING
  // ─────────────────────────────────────────────────────────
  function _startPolling(c) {
    if (c._interval) clearInterval(c._interval);
    if (!c.inId && !c.outId) return;
    _fetchHistory(c);
    c._interval = setInterval(() => _fetchHistory(c), 15000);
  }

  function atualizarTodos() { charts.forEach(c => _fetchHistory(c)); }

  async function _fetchHistory(c) {
    const dot = document.getElementById(`grph-dot-${c.id}`);
    if (dot) dot.classList.add('pulsing');

    try {
      const hours = c.hours || 1;
      const ids   = [c.inId, c.outId].filter(Boolean);
      const results = await Promise.all(
        ids.map(id => _get(
          `${URLS.history}?cliente_id=${clienteId}&item_id=${id}&hours=${hours}`
        ))
      );

      function _norm(raw) {
        if (!raw) return [];
        let arr;
        if (Array.isArray(raw)) {
          arr = raw;
        } else {
          arr = raw.history || raw.data || raw.result || raw.items || [];
          if (!Array.isArray(arr)) return [];
        }
        return arr.map(p => ({
          t: parseInt(p.t  || p.clock || 0),
          v: parseFloat(p.v !== undefined ? p.v : (p.value !== undefined ? p.value : 0)),
        })).filter(p => p.t > 0);
      }

      const histIn  = c.inId  ? _norm(results[0]) : [];
      const histOut = c.outId ? _norm(results[c.inId ? 1 : 0]) : [];

      if (histIn.length === 0 && histOut.length === 0) return;

      const allTs = [...new Set([...histIn.map(p => p.t), ...histOut.map(p => p.t)])].sort((a, b) => a - b);
      if (!allTs.length) return;

      const mapIn   = Object.fromEntries(histIn.map(p  => [p.t, p.v]));
      const mapOut  = Object.fromEntries(histOut.map(p => [p.t, p.v]));
      const labels  = allTs.map(_fmtTime);
      const dataIn  = allTs.map(t => mapIn[t]  !== undefined ? parseFloat(mapIn[t])  : null);
      const dataOut = allTs.map(t => mapOut[t] !== undefined ? parseFloat(mapOut[t]) : null);

      if (c.chartInstance) {
        c.chartInstance.data.labels           = labels;
        c.chartInstance.data.datasets[0].data = dataIn;
        c.chartInstance.data.datasets[1].data = dataOut;
        c.chartInstance.update('none');
      }

      if (c._fsSync && c.fsChartInstance) {
        c.fsChartInstance.data.labels           = labels;
        c.fsChartInstance.data.datasets[0].data = dataIn;
        c.fsChartInstance.data.datasets[1].data = dataOut;
        c.fsChartInstance.update('none');
        _updateFsStats(c);
      }

      const lastIn  = dataIn.filter(v => v !== null).at(-1);
      const lastOut = dataOut.filter(v => v !== null).at(-1);
      const peakIn  = Math.max(...dataIn.filter(v => v !== null), 0);
      const peakOut = Math.max(...dataOut.filter(v => v !== null), 0);
      const lastTs  = allTs[allTs.length - 1];

      _setText(`grph-in-${c.id}`,   _fmtBps(lastIn));
      _setText(`grph-out-${c.id}`,  _fmtBps(lastOut));
      _setText(`grph-peak-${c.id}`, _fmtBps(Math.max(peakIn, peakOut)));
      _setText(`grph-ts-${c.id}`,   `Atualizado às ${_fmtTime(lastTs)}`);

      if (dot) dot.classList.toggle('grph-dot-active', (lastIn || 0) > 0 || (lastOut || 0) > 0);

    } catch (e) {
      console.error('[GRAPH] poll error:', e);
    } finally {
      setTimeout(() => {
        const d = document.getElementById(`grph-dot-${c.id}`);
        if (d) d.classList.remove('pulsing');
      }, 700);
    }
  }

  function _setText(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  // ─────────────────────────────────────────────────────────
  // MODAIS
  // ─────────────────────────────────────────────────────────
  function abrirModalAdd() {
    _editingChart = null;
    _resetModal();
    document.getElementById('grph-modal-title').textContent = 'Adicionar Monitor';
    document.getElementById('grph-modal').style.display = 'flex';
  }

  function abrirModalEdit(id) {
    const c = charts.find(x => x.id === id);
    if (!c) return;
    _editingChart = id;
    _resetModal();
    document.getElementById('grph-modal-title').textContent = 'Editar Monitor';
    if (c.hostname) {
      document.getElementById('grph-m-search').value   = c.hostname;
      document.getElementById('grph-m-hostid').value   = c.hostid;
      document.getElementById('grph-m-hostname').value = c.hostname;
      const badge = document.getElementById('grph-m-badge');
      badge.textContent = `✓ ${c.hostname}`; badge.style.display = 'block';
      _carregarInterfaces(c.hostid, c.ifaceName);
    }
    // Popula título personalizado
    const tituloEl = document.getElementById('grph-m-titulo');
    if (tituloEl) tituloEl.value = c.titulo || '';

    document.getElementById('grph-modal').style.display = 'flex';
  }

  function fecharModal() { document.getElementById('grph-modal').style.display = 'none'; }

  function _resetModal() {
    ['grph-m-search','grph-m-hostid','grph-m-hostname','grph-m-iface-search','grph-m-iface-val','grph-m-titulo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    const badge = document.getElementById('grph-m-badge');
    if (badge) badge.style.display = 'none';
    const results = document.getElementById('grph-m-results');
    if (results) results.style.display = 'none';
    const preview = document.getElementById('grph-m-preview');
    if (preview) preview.style.display = 'none';
    const wrap = document.getElementById('grph-iface-wrap');
    if (wrap) wrap.style.display = 'none';
    const list = document.getElementById('grph-m-iface-list');
    if (list) { list.innerHTML = ''; list.style.display = 'none'; }
  }

  // ─────────────────────────────────────────────────────────
  // HOST SEARCH
  // ─────────────────────────────────────────────────────────
  function hostSearchDebounce(q) {
    clearTimeout(_hostTimer);
    _hostTimer = setTimeout(() => _buscarHosts(q), 300);
  }

  async function _buscarHosts(q) {
    const box = document.getElementById('grph-m-results');
    if (!q || q.length < 2) { box.style.display = 'none'; return; }
    const data = await _get(`${URLS.zbxHosts}?id=${clienteId}&q=${encodeURIComponent(q)}`);
    if (data.error || !data.hosts?.length) {
      box.innerHTML = '<div class="grph-ri"><span style="color:#64748b">Nenhum host encontrado</span></div>';
    } else {
      box.innerHTML = data.hosts.map(h => `
        <div class="grph-ri"
             onclick="GRAPH.selecionarHost('${h.hostid}','${(h.name||h.host).replace(/'/g,"\\'")}')">
          <div class="grph-ri-main">
            <span class="grph-ri-dot" style="background:${h.available==='up'?'#00ff88':'#ef4444'}"></span>
            <span>${h.name || h.host}</span>
          </div>
          <small>${h.ip} — <b style="color:${h.available==='up'?'#00ff88':'#ef4444'}">${h.available}</b></small>
        </div>`).join('');
    }
    box.style.display = 'block';
  }

  function selecionarHost(hostid, name) {
    document.getElementById('grph-m-hostid').value   = hostid;
    document.getElementById('grph-m-hostname').value = name;
    document.getElementById('grph-m-search').value   = name;
    document.getElementById('grph-m-results').style.display = 'none';
    document.getElementById('grph-m-preview').style.display = 'none';
    const badge = document.getElementById('grph-m-badge');
    badge.textContent = `✓ ${name}`; badge.style.display = 'block';
    _carregarInterfaces(hostid, null);
  }

  async function _carregarInterfaces(hostid, preselect) {
    const wrap = document.getElementById('grph-iface-wrap');
    const list = document.getElementById('grph-m-iface-list');
    const val  = document.getElementById('grph-m-iface-val');
    const prev = document.getElementById('grph-m-preview');

    if (wrap) wrap.style.display = 'none';
    if (list) { list.innerHTML = '<div class="grph-ri"><span style="color:#475569">Buscando itens…</span></div>'; list.style.display = 'block'; }
    if (val)  val.value = '';
    if (prev) prev.style.display = 'none';

    if (ifacesCache[hostid]) {
      _preencherIfaces(ifacesCache[hostid], preselect);
      return;
    }

    try {
      const data = await _get(`${URLS.zbxIfaces}?cliente_id=${clienteId}&host_id=${hostid}`);
      if (data.error || !data.interfaces?.length) {
        if (list) list.innerHTML = '<div class="grph-ri"><span style="color:#ef4444">Nenhum item encontrado neste host</span></div>';
        return;
      }
      ifacesCache[hostid] = data.interfaces;
      _preencherIfaces(data.interfaces, preselect);
    } catch(e) {
      if (list) list.innerHTML = `<div class="grph-ri"><span style="color:#ef4444">Erro: ${e.message}</span></div>`;
    }
  }

  function _preencherIfaces(ifaces, preselect) {
    const wrap = document.getElementById('grph-iface-wrap');
    const inp  = document.getElementById('grph-m-iface-search');
    if (wrap) wrap.style.display = 'block';
    if (inp)  inp.value = '';
    _renderIfaceList(ifaces, '');

    if (preselect) {
      const found = ifaces.find(i => i.name === preselect);
      if (found) _selecionarIface(found);
    }
  }

  function _renderIfaceList(ifaces, filtro) {
    const list = document.getElementById('grph-m-iface-list');
    if (!list) return;
    const f = filtro.toLowerCase();
    const filtered = f ? ifaces.filter(i => i.name.toLowerCase().includes(f)) : ifaces;

    if (!filtered.length) {
      list.innerHTML = '<div class="grph-ri"><span style="color:#475569">Nenhum resultado</span></div>';
      list.style.display = 'block';
      return;
    }

    list.innerHTML = filtered.map(i => {
      const temAmbos = i.in_id && i.out_id;
      const temUm    = i.in_id || i.out_id;
      const badge    = temAmbos
        ? '<span style="color:#00ff88;font-size:.68rem;margin-left:6px">↓↑</span>'
        : temUm
          ? '<span style="color:#f59e0b;font-size:.68rem;margin-left:6px">~</span>'
          : '';
      return `<div class="grph-ri grph-iface-item"
                   data-name="${i.name.replace(/"/g,'&quot;')}"
                   data-in="${i.in_id || ''}"
                   data-out="${i.out_id || ''}"
                   style="cursor:pointer">
        <div class="grph-ri-main">${i.name}${badge}</div>
        <small style="color:#475569;padding-left:0">
          In: ${i.in_id ? '<span style="color:#00ff88">✓</span>' : '—'} &nbsp;
          Out: ${i.out_id ? '<span style="color:#00d9ff">✓</span>' : '—'}
        </small>
      </div>`;
    }).join('');

    list.querySelectorAll('.grph-iface-item').forEach(function(el) {
      el.addEventListener('click', function() {
        grphSelecionarIface(
          el.dataset.name,
          el.dataset.in  || null,
          el.dataset.out || null
        );
      });
    });
    list.style.display = 'block';
  }

  function _selecionarIface(iface) {
    const val  = document.getElementById('grph-m-iface-val');
    const inp  = document.getElementById('grph-m-iface-search');
    const list = document.getElementById('grph-m-iface-list');
    if (val)  val.value = JSON.stringify({ iface: iface.name, inId: iface.in_id, outId: iface.out_id });
    if (inp)  inp.value = iface.name;
    if (list) list.style.display = 'none';
    _exibirPreviewIds(iface);
  }

  function ifaceChange() {}

  function _exibirPreviewIds(iface) {
    const prev = document.getElementById('grph-m-preview');
    if (!prev) return;
    prev.style.display = 'block';
    prev.innerHTML = `
      <div class="grph-preview-row">
        <span>In Item ID</span>
        <b style="color:#00ff88">${iface.in_id  || '<span style="color:#64748b">—</span>'}</b>
      </div>
      <div class="grph-preview-row">
        <span>Out Item ID</span>
        <b style="color:#00d9ff">${iface.out_id || '<span style="color:#64748b">—</span>'}</b>
      </div>`;
  }

  // ─────────────────────────────────────────────────────────
  // SALVAR / REMOVER
  // ─────────────────────────────────────────────────────────
  function salvarChart() {
    const hostid   = document.getElementById('grph-m-hostid').value;
    const hostname = document.getElementById('grph-m-hostname').value;
    const raw      = document.getElementById('grph-m-iface-val').value;
    const titulo   = (document.getElementById('grph-m-titulo') || {}).value?.trim() || '';

    if (!hostid || !raw) { alert('Selecione um host e uma interface.'); return; }
    let d;
    try { d = JSON.parse(raw); } catch { alert('Interface inválida.'); return; }

    if (_editingChart !== null) {
      const c = charts.find(x => x.id === _editingChart);
      if (c) {
        if (c._interval)     clearInterval(c._interval);
        if (c.chartInstance) c.chartInstance.destroy();
        Object.assign(c, {
          hostid, hostname, titulo,
          ifaceName: d.iface,
          inId: d.inId||null, outId: d.outId||null,
          hours: c.hours || 1,
          chartInstance: null, _interval: null,
        });
      }
    } else {
      charts.push({
        id: nextChartId++, hostid, hostname, titulo,
        ifaceName: d.iface,
        inId: d.inId||null, outId: d.outId||null,
        hours: 1,
        chartInstance: null, fsChartInstance: null, _interval: null, _fsSync: false,
      });
    }
    fecharModal();
    _salvarStorage();
    _renderGrid();
  }

  function removerChart(id) {
    const idx = charts.findIndex(c => c.id === id);
    if (idx === -1) return;
    const c = charts[idx];
    if (c._interval)      clearInterval(c._interval);
    if (c.chartInstance)  c.chartInstance.destroy();
    if (_fullscreenId === id) fecharFullscreen();
    charts.splice(idx, 1);
    _salvarStorage();
    _renderGrid();
  }

  // ─────────────────────────────────────────────────────────
  // UTILS
  // ─────────────────────────────────────────────────────────
  function _fmtBps(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    v = parseFloat(v);
    if (v >= 1e9) return `${(v/1e9).toFixed(2)} Gbps`;
    if (v >= 1e6) return `${(v/1e6).toFixed(2)} Mbps`;
    if (v >= 1e3) return `${(v/1e3).toFixed(1)} Kbps`;
    return `${v.toFixed(0)} bps`;
  }

  function _fmtTime(ts) {
    const d = new Date(ts * 1000);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  // ─────────────────────────────────────────────────────────
  // API PÚBLICA
  // ─────────────────────────────────────────────────────────
  return {
    init, abrirModalAdd, abrirModalEdit, fecharModal,
    hostSearchDebounce, selecionarHost, ifaceChange,
    salvarChart, removerChart, atualizarTodos,
    toggleFullscreen, fecharFullscreen,
    setPeriod, setFsPeriod,
    _renderIfaceList, _selecionarIface,
    get _ifacesCache() { return ifacesCache; },
  };
})();

window.GRAPH = GRAPH;

(function() {
  if (window.GRAPH && typeof window.GRAPH.init === 'function') {
    if (document.getElementById('grph-grid')) {
      window.GRAPH.init();
    }
  }
})();
</script>
