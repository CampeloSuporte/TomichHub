{% load static %}
<!--
  ABA MONITORAMENTO — tab_monitoramento.html
  Seleção direta de itens Zabbix (In/Out separados).
  Sistema de abas: cada aba tem seu próprio conjunto de painéis.
-->

<script>
  window.CLIENTE_ID = "{{ cliente.id }}";

  var _zbxCfg = {
    zbxSalvar:     '/monitoramento/zabbix/salvar/',
    zbxBuscar:     '/monitoramento/zabbix/buscar/',
    zbxTestar:     '/monitoramento/zabbix/testar/',
    zbxAutoConfig: '/monitoramento/zabbix/autoconfig/',
  };

  function _csrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  window.grphAbrirAdd = function() {
    if (window.GRAPH && typeof window.GRAPH.abrirModalAdd === 'function') {
      window.GRAPH.abrirModalAdd();
    }
  };

  window.grphAbrirZabbix = function() {
    var modal = document.getElementById('grph-modal-zabbix');
    if (!modal) return;
    var res = document.getElementById('grph-zbx-result');
    if (res) res.style.display = 'none';
    var p = document.getElementById('grph-zbx-pass');   if (p) p.value = '';
    var t = document.getElementById('grph-zbx-token');  if (t) t.value = '';
    modal.style.display = 'flex';
    fetch(_zbxCfg.zbxBuscar + '?id=' + window.CLIENTE_ID)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.existe) {
          var u   = document.getElementById('grph-zbx-url');
          var usr = document.getElementById('grph-zbx-user');
          if (u)   u.value   = d.url     || '';
          if (usr) usr.value = d.usuario || '';
        }
      })
      .catch(function(e){ console.warn('[GRAPH] zbxBuscar:', e); });
  };

  window.grphFecharZabbix = function() {
    var m = document.getElementById('grph-modal-zabbix');
    if (m) m.style.display = 'none';
  };

  window.grphAutoConfig = function() {
    var res = document.getElementById('grph-zbx-result');
    if (res) { res.textContent = 'Buscando configuração...'; res.className = 'grph-alert'; res.style.display = 'block'; }
    fetch(_zbxCfg.zbxAutoConfig + '?id=' + window.CLIENTE_ID)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.encontrado) {
          if (res) { res.textContent = d.message || 'Host "zabbix" não encontrado.'; res.className = 'grph-alert error'; }
          return;
        }
        var u   = document.getElementById('grph-zbx-url');
        var usr = document.getElementById('grph-zbx-user');
        var pw  = document.getElementById('grph-zbx-pass');
        if (u)   u.value   = d.url     || '';
        if (usr) usr.value = d.usuario || '';
        if (pw)  pw.value  = d.senha   || '';
        if (res) { res.textContent = 'Dados preenchidos a partir do host "' + d.tipo + '" (' + d.host + ')'; res.className = 'grph-alert success'; }
      })
      .catch(function(e){
        if (res) { res.textContent = 'Erro: ' + e.message; res.className = 'grph-alert error'; }
      });
  };

  window.grphTestar = function() {
    var res = document.getElementById('grph-zbx-result');
    if (!res) return;
    res.textContent = 'Testando conexão...'; res.className = 'grph-alert'; res.style.display = 'block';
    fetch(_zbxCfg.zbxTestar + '?id=' + window.CLIENTE_ID)
      .then(function(r){ return r.json(); })
      .then(function(d){ res.textContent = d.message; res.className = 'grph-alert ' + (d.success ? 'success' : 'error'); })
      .catch(function(e){ res.textContent = 'Erro: ' + e.message; res.className = 'grph-alert error'; });
  };

  window.grphSalvarZabbix = function() {
    var fd = new FormData();
    fd.append('cliente',   window.CLIENTE_ID);
    fd.append('url',       (document.getElementById('grph-zbx-url')   ||{}).value||'');
    fd.append('usuario',   (document.getElementById('grph-zbx-user')  ||{}).value||'');
    fd.append('senha',     (document.getElementById('grph-zbx-pass')  ||{}).value||'');
    fd.append('api_token', (document.getElementById('grph-zbx-token') ||{}).value||'');
    fetch(_zbxCfg.zbxSalvar, { method:'POST', headers:{'X-CSRFToken':_csrf()}, body:fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var res = document.getElementById('grph-zbx-result');
        if (!res) return;
        res.textContent = d.message || (d.success ? 'Salvo!' : 'Erro ao salvar');
        res.className = 'grph-alert ' + (d.success ? 'success' : 'error');
        res.style.display = 'block';
      })
      .catch(function(e){
        var res = document.getElementById('grph-zbx-result');
        if (res){ res.textContent='Erro: '+e.message; res.className='grph-alert error'; res.style.display='block'; }
      });
  };

  window.grphSetLayout = function(l) {
    var g = document.getElementById('grph-grid');
    if (!g) return;
    if (l === 'list') {
      g.style.gridTemplateColumns = '1fr';
    } else {
      var n = (window.GRAPH && window.GRAPH._getN && window.GRAPH._getN()) || 1;
      var cols = n === 1 ? 1 : n === 2 ? 2 : n === 4 ? 2 : Math.min(n, 3);
      g.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    }
    var bg = document.getElementById('grph-layout-grid');
    var bl = document.getElementById('grph-layout-list');
    if (bg) bg.classList.toggle('active', l === 'grid');
    if (bl) bl.classList.toggle('active', l === 'list');
  };

  window.grphAtualizar = function() {
    if (window.GRAPH && typeof window.GRAPH.atualizarTodos === 'function') window.GRAPH.atualizarTodos();
  };

  window.grphFecharModal = function() {
    if (window.GRAPH && typeof window.GRAPH.fecharModal === 'function') window.GRAPH.fecharModal();
  };

  window.grphSalvarChart = function() {
    if (window.GRAPH && typeof window.GRAPH.salvarChart === 'function') window.GRAPH.salvarChart();
  };

  window.grphHostSearch = function(v) {
    if (window.GRAPH && typeof window.GRAPH.hostSearchDebounce === 'function') window.GRAPH.hostSearchDebounce(v);
  };

  window.grphFiltrarItens = function(direcao, v) {
    if (window.GRAPH && typeof window.GRAPH.filtrarItens === 'function') window.GRAPH.filtrarItens(direcao, v);
  };

  window.grphSelecionarItem = function(direcao, itemJson) {
    if (window.GRAPH && typeof window.GRAPH.selecionarItem === 'function') {
      window.GRAPH.selecionarItem(direcao, itemJson);
    }
  };
</script>


<!-- ═══════════════════════════════════════════════════════
     ABA MONITORAMENTO
════════════════════════════════════════════════════════ -->
<div id="tab-monitoramento" class="tab-content-main" style="display:none;">

  <!-- ── TOOLBAR ──────────────────────────────────────────── -->
  <div class="grph-toolbar">
    <div class="grph-toolbar-left">
      <div class="grph-toolbar-brand">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <polyline points="2 17 7 12 11 15 16 9 22 12"
                    stroke="#3fb950" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 20h20" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Monitor de Tráfego</span>
      </div>

      <button class="grph-btn grph-btn-primary" onclick="grphAbrirAdd()">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Adicionar
      </button>

      <button class="grph-btn" onclick="grphAtualizar()" title="Forçar atualização de todos">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        Atualizar
      </button>
    </div>

    <div class="grph-toolbar-right">
      <div class="grph-live-pill">
        <span class="grph-live-dot"></span>
        <span>LIVE</span>
        <span class="grph-live-interval">15s</span>
      </div>

      <div class="grph-layout-toggle">
        <button class="grph-layout-btn active" id="grph-layout-grid"
                onclick="grphSetLayout('grid')" title="Grade">
          <svg viewBox="0 0 24 24" width="13" height="13">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
        <button class="grph-layout-btn" id="grph-layout-list"
                onclick="grphSetLayout('list')" title="Lista">
          <svg viewBox="0 0 24 24" width="13" height="13">
            <rect x="3" y="4" width="18" height="5" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="3" y="13" width="18" height="5" rx="1" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
      </div>

      <button class="grph-btn grph-btn-ghost" onclick="grphAbrirZabbix()" title="Configurar Zabbix API">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M19.07 4.93A10 10 0 1 1 4.93 19.07" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        Zabbix API
      </button>
    </div>
  </div>

  <!-- ── BARRA DE ABAS ────────────────────────────────────── -->
  <div id="grph-tabbar">
    <div id="grph-tabs-list"></div>
    <button class="grph-tab-add-btn" onclick="window.GRAPH && window.GRAPH.criarAba()" title="Nova aba de monitoramento">
      <svg viewBox="0 0 24 24" width="12" height="12">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      Nova aba
    </button>
  </div>

  <!-- ── MENU CONTEXTO DAS ABAS ───────────────────────────── -->
  <div id="grph-tab-ctx" style="display:none;">
    <button class="grph-ctx-item" id="grph-ctx-renomear">
      <svg viewBox="0 0 24 24" width="13" height="13">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      Renomear aba
    </button>
    <div class="grph-ctx-sep"></div>
    <button class="grph-ctx-item grph-ctx-danger" id="grph-ctx-fechar">
      <svg viewBox="0 0 24 24" width="13" height="13">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Fechar aba
    </button>
  </div>

  <!-- ── GRID DE GRÁFICOS ─────────────────────────────────── -->
  <div id="grph-grid" class="grph-grid"></div>

</div><!-- /#tab-monitoramento -->


<!-- ═══════════════════════════════════════════════════════
     MODAL: ADICIONAR / EDITAR MONITOR
════════════════════════════════════════════════════════ -->
<div id="grph-modal" class="grph-overlay" style="display:none;">
  <div class="grph-modal">
    <div class="grph-modal-header">
      <div class="grph-modal-title-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <polyline points="2 17 7 12 11 15 16 9 22 12"
                    stroke="#3fb950" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3 id="grph-modal-title">Adicionar Monitor</h3>
      </div>
      <button class="grph-modal-close" onclick="grphFecharModal()">✕</button>
    </div>

    <div class="grph-modal-body">

      <!-- HOST -->
      <label class="grph-label">Host Zabbix *</label>
      <div class="grph-search-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" class="grph-search-icon">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="grph-m-search" type="text" class="grph-input grph-input-search"
               placeholder="Buscar host pelo nome ou IP…"
               oninput="grphHostSearch(this.value)"/>
      </div>
      <div id="grph-m-results" class="grph-search-results" style="display:none;"></div>
      <div id="grph-m-badge" class="grph-host-badge" style="display:none;"></div>
      <input type="hidden" id="grph-m-hostid"/>
      <input type="hidden" id="grph-m-hostname"/>

      <!-- TÍTULO PERSONALIZADO -->
      <label class="grph-label" style="margin-top:18px;">
        Título do gráfico
        <span class="grph-badge-optional">opcional</span>
      </label>
      <div class="grph-input-icon-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" class="grph-input-icon">
          <path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <input id="grph-m-titulo" type="text" class="grph-input grph-input-icon-pad"
               placeholder="Ex: Link Cliente ABC — 100Mbps"/>
      </div>
      <p class="grph-hint">Deixe vazio para usar o nome do host.</p>

      <!-- ITENS IN/OUT — aparece após selecionar host -->
      <div id="grph-itens-wrap" style="display:none;">

        <!-- ITEM IN (DOWNLOAD) -->
        <label class="grph-label" style="margin-top:18px;">
          <span style="color:#3fb950;">↓</span> Item Download (Bits received) *
        </label>
        <div class="grph-search-wrap">
          <svg viewBox="0 0 24 24" width="14" height="14" class="grph-search-icon">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="grph-m-item-in-search" type="text" class="grph-input grph-input-search"
                 placeholder="Buscar item… ex: Bits received"
                 oninput="grphFiltrarItens('in', this.value)"/>
        </div>
        <div id="grph-m-item-in-badge" class="grph-host-badge"
             style="display:none; background:rgba(63,185,80,.06); border-color:rgba(63,185,80,.2); color:#3fb950; margin-bottom:4px;"></div>
        <div id="grph-m-item-in-list" class="grph-search-results" style="display:none; max-height:180px;"></div>
        <input type="hidden" id="grph-m-item-in-id"/>

        <!-- ITEM OUT (UPLOAD) -->
        <label class="grph-label" style="margin-top:14px;">
          <span style="color:#58a6ff;">↑</span> Item Upload (Bits sent) *
        </label>
        <div class="grph-search-wrap">
          <svg viewBox="0 0 24 24" width="14" height="14" class="grph-search-icon">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="grph-m-item-out-search" type="text" class="grph-input grph-input-search"
                 placeholder="Buscar item… ex: Bits sent"
                 oninput="grphFiltrarItens('out', this.value)"/>
        </div>
        <div id="grph-m-item-out-badge" class="grph-host-badge"
             style="display:none; background:rgba(88,166,255,.06); border-color:rgba(88,166,255,.2); color:#58a6ff; margin-bottom:4px;"></div>
        <div id="grph-m-item-out-list" class="grph-search-results" style="display:none; max-height:180px;"></div>
        <input type="hidden" id="grph-m-item-out-id"/>

        <!-- PREVIEW IDs -->
        <div id="grph-m-preview" class="grph-preview-box" style="display:none; margin-top:12px;"></div>

      </div><!-- /#grph-itens-wrap -->

    </div>

    <div class="grph-modal-footer">
      <button class="grph-btn grph-btn-ghost" onclick="grphFecharModal()">Cancelar</button>
      <button class="grph-btn grph-btn-primary" onclick="grphSalvarChart()">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        Confirmar
      </button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     MODAL: ZABBIX API
════════════════════════════════════════════════════════ -->
<div id="grph-modal-zabbix" class="grph-overlay" style="display:none;">
  <div class="grph-modal">
    <div class="grph-modal-header">
      <div class="grph-modal-title-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="3" stroke="#00d9ff" stroke-width="2" fill="none"/>
          <path d="M19.07 4.93A10 10 0 1 1 4.93 19.07" stroke="#00d9ff" stroke-width="2" fill="none"/>
        </svg>
        <h3>Configuração Zabbix API</h3>
      </div>
      <button class="grph-modal-close" onclick="grphFecharZabbix()">✕</button>
    </div>

    <div class="grph-modal-body">
      <label class="grph-label">URL do Zabbix *</label>
      <input id="grph-zbx-url" type="url" class="grph-input"
             placeholder="https://zabbix.empresa.com"/>
      <p class="grph-hint">Não inclua <code>/api_jsonrpc.php</code></p>

      <label class="grph-label" style="margin-top:14px;">
        Token de API
        <span class="grph-badge">Zabbix 5.4+</span>
      </label>
      <input id="grph-zbx-token" type="password" class="grph-input"
             placeholder="Deixe vazio para usar usuário/senha"/>

      <div class="grph-two-col" style="margin-top:14px;">
        <div>
          <label class="grph-label">Usuário</label>
          <input id="grph-zbx-user" type="text" class="grph-input" placeholder="Admin"/>
        </div>
        <div>
          <label class="grph-label">Senha</label>
          <input id="grph-zbx-pass" type="password" class="grph-input" placeholder="••••••••"/>
        </div>
      </div>

      <div id="grph-zbx-result" class="grph-alert" style="display:none;"></div>
    </div>

    <div class="grph-modal-footer" style="justify-content:space-between;">
      <button class="grph-btn grph-btn-ghost" onclick="grphAutoConfig()" title="Preencher a partir do host 'zabbix' nos acessos do cliente">
        <svg viewBox="0 0 24 24" width="13" height="13">
          <path d="M12 2a10 10 0 1 0 10 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M18 2v6h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Auto-preencher
      </button>
      <div style="display:flex;gap:8px;">
        <button class="grph-btn grph-btn-ghost" onclick="grphTestar()">
          <svg viewBox="0 0 24 24" width="13" height="13">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
          Testar
        </button>
        <button class="grph-btn grph-btn-primary" onclick="grphSalvarZabbix()">Salvar</button>
      </div>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     ESTILOS
════════════════════════════════════════════════════════ -->
<style>
#tab-monitoramento * { box-sizing: border-box; }
#tab-monitoramento {
  display: flex; flex-direction: column;
  min-height: 600px;
  background: #080f1a; border-radius: 10px;
}
#tab-monitoramento .grph-grid {
  min-height: 300px;
}
.grph-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; flex-shrink: 0; gap: 10px; flex-wrap: wrap;
  background: linear-gradient(180deg, #0d1829 0%, #0a1520 100%);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.grph-toolbar-left, .grph-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grph-toolbar-brand {
  display: flex; align-items: center; gap: 8px;
  font-size: .82rem; font-weight: 700; color: #e2e8f0;
  letter-spacing: .3px; padding-right: 12px;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.grph-live-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(63,185,80,0.07); border: 1px solid rgba(63,185,80,0.2);
  border-radius: 20px; padding: 4px 10px;
  font-size: .7rem; font-weight: 700; color: #3fb950; letter-spacing: .5px;
}
.grph-live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #3fb950; animation: grph-blink 1.3s ease-in-out infinite;
}
.grph-live-interval { color: #334155; font-weight: 400; font-size: .68rem; }
@keyframes grph-blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.grph-layout-toggle {
  display: flex; background: #0a1520; border: 1px solid #1e293b; border-radius: 6px; padding: 2px;
}
.grph-layout-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: none; border-radius: 4px;
  background: transparent; color: #475569; cursor: pointer; transition: all .15s;
}
.grph-layout-btn.active { background: #1e293b; color: #e2e8f0; }
.grph-layout-btn:hover:not(.active) { color: #94a3b8; }
.grph-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 7px;
  font-size: .78rem; font-weight: 500; cursor: pointer;
  border: 1px solid #1e293b; background: #0d1829; color: #94a3b8;
  transition: all .15s; letter-spacing: .2px;

<script src="/static/js/chart.umd.min.js"></script>
<script>
'use strict';

const GRAPH = (() => {

  // ── Estado ────────────────────────────────────────────────
  let clienteId     = null;
  let tabs          = [];          // [{ id, nome, charts: [...] }]
  let activeTabId   = 0;
  let nextTabId     = 1;
  let nextChartId   = 1;
  let charts        = [];          // alias: _activeTab().charts — sincronizado por _sync()
  let itensCache    = {};
  let _hostTimer    = null;
  let _editingChart = null;
  let _fullscreenId = null;

  // ── Helpers ───────────────────────────────────────────────
  function _activeTab() {
    return tabs.find(t => t.id === activeTabId) || tabs[0] || { id: 0, nome: '', charts: [] };
  }
  function _sync() { charts = _activeTab().charts; }

  function _escH(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Paleta ────────────────────────────────────────────────
  const C = {
    in:      '#3fb950',
    out:     '#00d9ff',
    inFill:  'rgba(63,185,80,0.08)',
    outFill: 'rgba(88,166,255,0.08)',
    grid:    'rgba(255,255,255,0.04)',
    text:    '#475569',
  };

  const URLS = {
    zbxHosts: '/monitoramento/zabbix/hosts/',
    zbxItens: '/monitoramento/zabbix/itens/',
    history:  '/monitoramento/zabbix/history/',
  };

  async function _get(url) {
    const r = await fetch(url);
    return r.json();
  }

  // ── Persistência ──────────────────────────────────────────
  function _storageKey() { return 'grph_tabs_v1_' + (window.CLIENTE_ID || 'default'); }

  function _tabsPayload() {
    return tabs.map(tab => ({
      id: tab.id, nome: tab.nome,
      charts: tab.charts.map(c => ({
        id: c.id, hostid: c.hostid, hostname: c.hostname,
        titulo: c.titulo || '', ifaceName: c.ifaceName,
        inId: c.inId, outId: c.outId, hours: c.hours || 1,
      })),
    }));
  }

  function _salvarStorage() {
    try {
      localStorage.setItem(_storageKey(), JSON.stringify({
        tabs: _tabsPayload(), activeTabId, nextTabId, nextChartId,
      }));
    } catch(e) { console.warn('[GRAPH] storage write:', e); }
    fetch('/monitoramento/dash/salvar/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': _csrf() },
      body: JSON.stringify({ cliente_id: clienteId, tabs: _tabsPayload() }),
    }).catch(e => console.warn('[GRAPH] backend save:', e));
  }

  function _parseTabs(raw) {
    if (!raw) return null;
    let src, parsedActiveTabId, parsedNextTabId, parsedNextChartId;

    if (raw.tabs) {
      // Formato novo: { tabs: [...], activeTabId, ... }
      src                = raw.tabs;
      parsedActiveTabId  = raw.activeTabId || src[0]?.id || 1;
      parsedNextTabId    = raw.nextTabId   || (Math.max(0, ...src.map(t => t.id)) + 1);
      parsedNextChartId  = raw.nextChartId || (Math.max(0, ...src.flatMap(t => (t.charts||[]).map(c => c.id)), 0) + 1);
    } else if (Array.isArray(raw) && raw.some && raw.some(c => c.hostid)) {
      // Formato antigo: lista plana de charts
      src = [{ id: 1, nome: 'Geral', charts: raw }];
      parsedActiveTabId = 1; parsedNextTabId = 2;
      parsedNextChartId = Math.max(0, ...raw.map(c => c.id)) + 1;
    } else {
      return null;
    }

    return {
      tabs: src.map(tab => ({
        id: tab.id, nome: tab.nome || 'Aba',
        charts: (tab.charts || []).map(c => ({
          ...c, titulo: c.titulo || '', hours: c.hours || 1,
          chartInstance: null, fsChartInstance: null, _interval: null, _fsSync: false,
        })),
      })),
      activeTabId: parsedActiveTabId,
      nextTabId:   parsedNextTabId,
      nextChartId: parsedNextChartId,
    };
  }

  function _carregarStorage() {
    try {
      const raw = localStorage.getItem(_storageKey());
      if (!raw) return false;
      const parsed = _parseTabs(JSON.parse(raw));
      if (!parsed) return false;
      ({ tabs, activeTabId, nextTabId, nextChartId } = parsed);
      _sync();
      return true;
    } catch(e) { console.warn('[GRAPH] storage read:', e); return false; }
  }

  function _destroyAll() {
    tabs.forEach(tab => tab.charts.forEach(c => {
      if (c._interval)     { clearInterval(c._interval); c._interval = null; }
      if (c.chartInstance) { c.chartInstance.destroy();  c.chartInstance = null; }
    }));
  }

  // ─────────────────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────────────────
  async function init() {
    _destroyAll();
    clienteId = window.CLIENTE_ID || null;

    try {
      const resp = await fetch('/monitoramento/dash/carregar/?id=' + clienteId);
      const data = await resp.json();

      const rawForParsing = data.tabs ? data
                          : (data.charts?.length ? data.charts : null);
      const parsed = rawForParsing ? _parseTabs(rawForParsing) : null;

      if (parsed?.tabs?.length) {
        ({ tabs, activeTabId, nextTabId, nextChartId } = parsed);
        _sync();
        try {
          localStorage.setItem(_storageKey(), JSON.stringify({
            tabs: _tabsPayload(), activeTabId, nextTabId, nextChartId,
          }));
        } catch(e) {}
      } else {
        if (!_carregarStorage()) {
          tabs = [{ id: 1, nome: 'Geral', charts: [] }];
          activeTabId = 1; nextTabId = 2; nextChartId = 1; _sync();
        }
        if (charts.length) _salvarStorage();
      }
    } catch(e) {
      console.warn('[GRAPH] backend load failed:', e);
      if (!_carregarStorage()) {
        tabs = [{ id: 1, nome: 'Geral', charts: [] }];
        activeTabId = 1; nextTabId = 2; nextChartId = 1; _sync();
      }
    }

    if (!tabs.length) {
      tabs = [{ id: 1, nome: 'Geral', charts: [] }];
      activeTabId = 1; nextTabId = 2; nextChartId = 1; _sync();
    }

    _renderTabBar();
    _renderGrid();
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && _fullscreenId !== null) fecharFullscreen();
    });
  }

  // ─────────────────────────────────────────────────────────
  // BARRA DE ABAS
  // ─────────────────────────────────────────────────────────
  function _renderTabBar() {
    const list = document.getElementById('grph-tabs-list');
    if (!list) return;
    list.innerHTML = tabs.map(tab => {
      const active = tab.id === activeTabId ? ' grph-tab-active' : '';
      const cnt    = tab.charts.length;
      const badge  = cnt > 0 ? `<span class="grph-tab-badge">${cnt}</span>` : '';
      const close  = tabs.length > 1
        ? `<button class="grph-tab-close" onclick="event.stopPropagation();window.GRAPH.removerAba(${tab.id})" title="Fechar aba">✕</button>`
        : '';
      return `<div class="grph-tab${active}" data-tab-id="${tab.id}"
                   onclick="window.GRAPH.trocarAba(${tab.id})"
                   oncontextmenu="event.preventDefault();event.stopPropagation();window.GRAPH._abrirCtxMenu(event,${tab.id})">
        <span class="grph-tab-name" id="grph-tab-name-${tab.id}"
              ondblclick="event.stopPropagation();window.GRAPH.iniciarRenomear(${tab.id})"
              title="Duplo-clique ou clique direito para renomear">${_escH(tab.nome)}</span>
        ${badge}${close}
      </div>`;
    }).join('');

    // Rola para a aba ativa
    const activeEl = list.querySelector('.grph-tab-active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function trocarAba(tabId) {
    if (tabId === activeTabId) return;
    // Destroi instâncias da aba atual para liberar memória/CPU
    charts.forEach(c => {
      if (c._interval)     { clearInterval(c._interval); c._interval = null; }
      if (c.chartInstance) { c.chartInstance.destroy();  c.chartInstance = null; }
    });
    if (_fullscreenId !== null) fecharFullscreen();
    activeTabId = tabId;
    _sync();
    _renderTabBar();
    _renderGrid();
    _salvarStorage();
  }

  function criarAba() {
    // Destroi aba atual para liberar recursos
    charts.forEach(c => {
      if (c._interval)     { clearInterval(c._interval); c._interval = null; }
      if (c.chartInstance) { c.chartInstance.destroy();  c.chartInstance = null; }
    });
    const newTab = { id: nextTabId++, nome: 'Nova aba', charts: [] };
    tabs.push(newTab);
    activeTabId = newTab.id;
    _sync();
    _salvarStorage();
    _renderTabBar();
    _renderGrid();
    // Inicia edição do nome imediatamente
    setTimeout(() => iniciarRenomear(newTab.id), 80);
  }

  function removerAba(tabId) {
    if (tabs.length <= 1) return;
    const idx = tabs.findIndex(t => t.id === tabId);
    if (idx === -1) return;
    // Destroi instâncias da aba removida
    tabs[idx].charts.forEach(c => {
      if (c._interval)     { clearInterval(c._interval); c._interval = null; }
      if (c.chartInstance) { c.chartInstance.destroy();  c.chartInstance = null; }
    });
    tabs.splice(idx, 1);
    if (activeTabId === tabId) {
      activeTabId = tabs[Math.max(0, idx - 1)].id;
      _sync();
      _renderGrid();
    }
    _renderTabBar();
    _salvarStorage();
  }

  function renomearAba(tabId, novoNome) {
    const tab = tabs.find(t => t.id === tabId);
    if (tab && novoNome.trim()) tab.nome = novoNome.trim();
    _renderTabBar();
    _salvarStorage();
  }

  // ─────────────────────────────────────────────────────────
  // MENU DE CONTEXTO DAS ABAS
  // ─────────────────────────────────────────────────────────
  let _ctxTabId = null;

  function _abrirCtxMenu(e, tabId) {
    _ctxTabId = tabId;
    trocarAba(tabId);   // ativa a aba antes de abrir o menu

    const menu = document.getElementById('grph-tab-ctx');
    if (!menu) return;

    // Posição junto ao cursor, garantindo que não saia da tela
    menu.style.display = 'block';
    const mw = menu.offsetWidth  || 180;
    const mh = menu.offsetHeight || 80;
    let x = e.clientX, y = e.clientY;
    if (x + mw > window.innerWidth)  x = window.innerWidth  - mw - 8;
    if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
    menu.style.left = x + 'px';
    menu.style.top  = y + 'px';

    // Configura ações dos itens
    const btnRenomear = document.getElementById('grph-ctx-renomear');
    const btnFechar   = document.getElementById('grph-ctx-fechar');
    if (btnRenomear) {
      btnRenomear.onclick = () => { _fecharCtxMenu(); iniciarRenomear(tabId); };
    }
    if (btnFechar) {
      btnFechar.style.display = tabs.length > 1 ? '' : 'none';
      btnFechar.onclick = () => { _fecharCtxMenu(); removerAba(tabId); };
    }
    const sep = document.querySelector('.grph-ctx-sep');
    if (sep) sep.style.display = tabs.length > 1 ? '' : 'none';
  }

  function _fecharCtxMenu() {
    const menu = document.getElementById('grph-tab-ctx');
    if (menu) menu.style.display = 'none';
    _ctxTabId = null;
  }

  // Fecha o menu ao clicar fora
  document.addEventListener('click',       () => _fecharCtxMenu(), true);
  document.addEventListener('contextmenu', e => {
    if (!e.target.closest('[data-tab-id]')) _fecharCtxMenu();
  }, true);

  function iniciarRenomear(tabId) {
    const nameEl = document.getElementById(`grph-tab-name-${tabId}`);
    if (!nameEl) return;
    const oldNome = tabs.find(t => t.id === tabId)?.nome || '';
    const input = document.createElement('input');
    input.value = oldNome;
    input.style.cssText = [
      'background:transparent', 'border:none', 'outline:none',
      'color:inherit', 'font:inherit', 'padding:0', 'margin:0',
      'min-width:40px', 'max-width:130px',
      `width:${Math.max(40, Math.min(130, oldNome.length * 8))}px`,
    ].join(';');
    input.onclick  = e => e.stopPropagation();
    nameEl.replaceWith(input);
    input.focus(); input.select();
    const commit = () => renomearAba(tabId, input.value || oldNome);
    input.addEventListener('blur',    commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = oldNome; input.blur(); }
    });
  }

  // ─────────────────────────────────────────────────────────
  // GRID
  // ─────────────────────────────────────────────────────────
  function _renderGrid() {
    const grid = document.getElementById('grph-grid');
    if (!grid) return;
    grid.innerHTML = '';

    if (!charts.length) {
      grid.style.gridTemplateColumns = '1fr';
      grid.innerHTML = _emptyState();
      return;
    }

    const n = charts.length;
    const cols = n === 1 ? 1 : n === 2 ? 2 : n === 4 ? 2 : Math.min(n, 3);
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    charts.forEach(c => {
      const card = document.createElement('div');
      card.className = 'grph-card';
      card.id = `grph-card-${c.id}`;
      card.innerHTML = _cardHTML(c);
      grid.appendChild(card);
      _initChart(c);
    });
  }

          <rect x="26" y="32" width="16" height="44" rx="3" fill="url(#emptyGrad)" opacity=".6"/>
          <rect x="48" y="40" width="16" height="36" rx="3" fill="url(#emptyGrad)" opacity=".7"/>
          <rect x="70" y="20" width="16" height="56" rx="3" fill="url(#emptyGrad)" opacity=".8"/>

        </div>

        <div class="grph-stat-block grph-stat-peak">
          <svg viewBox="0 0 24 24" width="12" height="12" style="opacity:.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <div><div class="grph-stat-val" id="grph-peak-${c.id}">—</div><div class="grph-stat-label">Pico (${hours}h)</div></div>

      <div class="grph-footer">
        <span class="grph-ts" id="grph-ts-${c.id}">Aguardando dados...</span>

          <div class="grph-period-sel" id="grph-period-${c.id}">${periodBtns}</div>

  // ─────────────────────────────────────────────────────────
  // CHART.JS
  // ─────────────────────────────────────────────────────────
  function _chartConfig() {
    return {
      type: 'line',
      data: { labels: [], datasets: [
        { label: 'Download ↓', data: [], borderColor: C.in,  backgroundColor: C.inFill,  borderWidth: 2, pointRadius: 0, fill: true, tension: 0.4, spanGaps: true },
        { label: 'Upload ↑',   data: [], borderColor: C.out, backgroundColor: C.outFill, borderWidth: 2, pointRadius: 0, fill: true, tension: 0.4, spanGaps: true },
      ]},
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, labels: { color: '#64748b', font: { size: 10 }, boxWidth: 10, padding: 12 } },
          tooltip: {
            backgroundColor: '#0f172a', borderColor: '#334155', borderWidth: 1,
            titleColor: '#e2e8f0', bodyColor: '#94a3b8', padding: 12, cornerRadius: 8,
            callbacks: { label: ctx => `  ${ctx.dataset.label}: ${_fmtBps(ctx.raw)}` },
          },
        },
        scales: {
          x: { display: true, ticks: { color: C.text, font: { size: 9 }, maxRotation: 0, maxTicksLimit: 8 }, grid: { color: C.grid }, border: { color: 'transparent' } },
          y: { min: 0, display: true, ticks: { color: C.text, font: { size: 9 }, callback: v => _fmtBps(v) }, grid: { color: C.grid }, border: { color: 'transparent' } },
        },
      },
    };
  }

  function _initChart(c) {
    const canvas = document.getElementById(`grph-cv-${c.id}`);
    if (!canvas) return;
    if (typeof Chart === 'undefined') {
      canvas.parentElement.innerHTML = '<p style="color:#475569;text-align:center;padding:24px;font-size:.78rem;">Chart.js não encontrado.</p>';
      return;
    }
    c.chartInstance = new Chart(canvas, _chartConfig());
    _startPolling(c);
  }

  // ─────────────────────────────────────────────────────────
  // PERÍODO
  // ─────────────────────────────────────────────────────────
  function setPeriod(id, hours) {
    const c = charts.find(x => x.id === id);
    if (!c) return;
    c.hours = hours;
    const peakLabel = document.querySelector(`#grph-card-${id} .grph-stat-peak .grph-stat-label`);
    if (peakLabel) peakLabel.textContent = `Pico (${hours}h)`;
    const sel = document.getElementById(`grph-period-${id}`);
    if (sel) sel.querySelectorAll('.grph-period-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.textContent) === hours);
    });
    _salvarStorage();
    _fetchHistory(c);
  }

  // ─────────────────────────────────────────────────────────
  // FULLSCREEN
  // ─────────────────────────────────────────────────────────
  function toggleFullscreen(id) {
    if (_fullscreenId === id) { fecharFullscreen(); return; }
    _fullscreenId = id;
    const c = charts.find(x => x.id === id);
    if (!c) return;

    let overlay = document.getElementById('grph-fullscreen-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'grph-fullscreen-overlay';
      overlay.className = 'grph-fullscreen-overlay';
      overlay.onclick = e => { if (e.target === overlay) fecharFullscreen(); };
      document.body.appendChild(overlay);
    }

    const hours = c.hours || 1;
    const fsPeriodBtns = [1, 3, 6, 12, 24].map(h =>
      `<button class="grph-period-btn ${h === hours ? 'active' : ''}" onclick="GRAPH.setFsPeriod(${c.id},${h})" style="font-size:.72rem;padding:3px 9px;">${h}h</button>`
    ).join('');
    const fsTitle = c.titulo || c.hostname || '—';
    const fsSub   = c.titulo ? `${c.hostname||''} · ${c.ifaceName||''}` : (c.ifaceName || '—');

    overlay.innerHTML = `
      <div class="grph-fullscreen-modal">
        <div class="grph-fullscreen-header">
          <div>
            <h2 class="grph-fullscreen-title">${fsTitle}</h2>
            <p class="grph-fullscreen-sub">${fsSub}</p>
          </div>
          <div class="grph-fullscreen-actions">
            <div class="grph-period-sel" id="grph-fs-period" style="margin-right:8px;">${fsPeriodBtns}</div>
            <div class="grph-fs-stats">
              <span class="grph-fs-stat-in"  id="grph-fs-in">↓ —</span>
              <span class="grph-fs-stat-out" id="grph-fs-out">↑ —</span>
            </div>
            <button class="grph-icon-btn" onclick="GRAPH.fecharFullscreen()" title="Fechar">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="grph-fullscreen-canvas-wrap"><canvas id="grph-fs-canvas"></canvas></div>
        <div class="grph-fullscreen-footer"><span id="grph-fs-ts">—</span></div>
      </div>`;

    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    if (typeof Chart !== 'undefined') {
      c.fsChartInstance = new Chart(document.getElementById('grph-fs-canvas'), _chartConfig());
      if (c.chartInstance) {
        c.fsChartInstance.data = JSON.parse(JSON.stringify(c.chartInstance.data));
        c.fsChartInstance.update('none');
      }
      c._fsSync = true;
    }
    _updateFsStats(c);
  }

  function fecharFullscreen() {
    const c = charts.find(x => x.id === _fullscreenId);
    if (c) {
      c._fsSync = false;
      if (c.fsChartInstance) { c.fsChartInstance.destroy(); c.fsChartInstance = null; }
    }
    const ov = document.getElementById('grph-fullscreen-overlay');
    if (ov) ov.style.display = 'none';
    document.body.style.overflow = '';
    _fullscreenId = null;
  }

  function setFsPeriod(id, hours) {
    const sel = document.getElementById('grph-fs-period');
    if (sel) sel.querySelectorAll('.grph-period-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.textContent) === hours);
    });
    setPeriod(id, hours);
  }

  function _updateFsStats(c) {
    const si = document.getElementById(`grph-in-${c.id}`);
    const so = document.getElementById(`grph-out-${c.id}`);
    const st = document.getElementById(`grph-ts-${c.id}`);
    const fi = document.getElementById('grph-fs-in');
    const fo = document.getElementById('grph-fs-out');
    const ft = document.getElementById('grph-fs-ts');
    if (fi && si) fi.textContent = '↓ ' + (si.textContent || '—');
    if (fo && so) fo.textContent = '↑ ' + (so.textContent || '—');
    if (ft && st) ft.textContent = st.textContent;
  }

  // ─────────────────────────────────────────────────────────
  // POLLING
  // ─────────────────────────────────────────────────────────
  function _startPolling(c) {
    if (c._interval) clearInterval(c._interval);
    if (!c.inId && !c.outId) return;
    _fetchHistory(c);
    c._interval = setInterval(() => _fetchHistory(c), 15000);
  }

  function atualizarTodos() { charts.forEach(c => _fetchHistory(c)); }

  async function _fetchHistory(c) {
    const dot = document.getElementById(`grph-dot-${c.id}`);
    if (dot) dot.classList.add('pulsing');

    try {
      const hours   = c.hours || 1;
      const ids     = [c.inId, c.outId].filter(Boolean);
      const results = await Promise.all(
        ids.map(id => _get(`${URLS.history}?cliente_id=${clienteId}&item_id=${id}&hours=${hours}`))
      );

      function _norm(raw) {
        if (!raw) return [];
        const arr = raw.history || raw.data || raw.result || (Array.isArray(raw) ? raw : []);
        return arr.map(p => ({
          t: parseInt(p.t || p.clock || 0),
          v: parseFloat(p.v !== undefined ? p.v : (p.value !== undefined ? p.value : 0)),
        })).filter(p => p.t > 0);
      }

      const histIn  = c.inId  ? _norm(results[0]) : [];
      const histOut = c.outId ? _norm(results[c.inId ? 1 : 0]) : [];
      if (!histIn.length && !histOut.length) return;

      const allTs  = [...new Set([...histIn.map(p => p.t), ...histOut.map(p => p.t)])].sort((a, b) => a - b);
      const mapIn  = Object.fromEntries(histIn.map(p  => [p.t, p.v]));
      const mapOut = Object.fromEntries(histOut.map(p => [p.t, p.v]));
      const labels  = allTs.map(_fmtTime);
      const dataIn  = allTs.map(t => mapIn[t]  !== undefined ? parseFloat(mapIn[t])  : null);
      const dataOut = allTs.map(t => mapOut[t] !== undefined ? parseFloat(mapOut[t]) : null);

      if (c.chartInstance) {
        c.chartInstance.data.labels           = labels;
        c.chartInstance.data.datasets[0].data = dataIn;
        c.chartInstance.data.datasets[1].data = dataOut;
        c.chartInstance.update('none');
      }
      if (c._fsSync && c.fsChartInstance) {
        c.fsChartInstance.data.labels           = labels;
        c.fsChartInstance.data.datasets[0].data = dataIn;
        c.fsChartInstance.data.datasets[1].data = dataOut;
        c.fsChartInstance.update('none');
        _updateFsStats(c);
      }

      const lastIn  = dataIn.filter(v => v !== null).at(-1);
      const lastOut = dataOut.filter(v => v !== null).at(-1);
      const peakIn  = Math.max(...dataIn.filter(v  => v !== null), 0);
      const peakOut = Math.max(...dataOut.filter(v => v !== null), 0);

      _setText(`grph-in-${c.id}`,   _fmtBps(lastIn));
      _setText(`grph-out-${c.id}`,  _fmtBps(lastOut));
      _setText(`grph-peak-${c.id}`, _fmtBps(Math.max(peakIn, peakOut)));
      _setText(`grph-ts-${c.id}`,   `Atualizado às ${_fmtTime(allTs[allTs.length - 1])}`);
      if (dot) dot.classList.toggle('grph-dot-active', (lastIn || 0) > 0 || (lastOut || 0) > 0);

    } catch(e) {
      console.error('[GRAPH] poll error:', e);
    } finally {
      setTimeout(() => {
        const d = document.getElementById(`grph-dot-${c.id}`);
        if (d) d.classList.remove('pulsing');
      }, 700);
    }
  }

  function _setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

  // ─────────────────────────────────────────────────────────
  // MODAL — ABRIR/FECHAR/RESET
  // ─────────────────────────────────────────────────────────
  function abrirModalAdd() {
    _editingChart = null;
    _resetModal();
    document.getElementById('grph-modal-title').textContent = 'Adicionar Monitor';
    document.getElementById('grph-modal').style.display = 'flex';
  }

  function abrirModalEdit(id) {
    const c = charts.find(x => x.id === id);
    if (!c) return;
    _editingChart = id;
    _resetModal();
    document.getElementById('grph-modal-title').textContent = 'Editar Monitor';

    document.getElementById('grph-m-search').value   = c.hostname || '';
    document.getElementById('grph-m-hostid').value   = c.hostid   || '';
    document.getElementById('grph-m-hostname').value = c.hostname || '';
    document.getElementById('grph-m-titulo').value   = c.titulo   || '';

    const badge = document.getElementById('grph-m-badge');
    if (badge && c.hostname) { badge.textContent = `✓ ${c.hostname}`; badge.style.display = 'block'; }

    if (c.hostid) {
      _carregarItens(c.hostid).then(() => {
        const itens = itensCache[c.hostid] || [];
        if (c.inId) {
          const item = itens.find(i => i.itemid === c.inId);
          _selecionarItemInterno('in', item || { itemid: c.inId, name: c.ifaceName + ' (In)' });
        }
        if (c.outId) {
          const item = itens.find(i => i.itemid === c.outId);
          _selecionarItemInterno('out', item || { itemid: c.outId, name: c.ifaceName + ' (Out)' });
        }
        _atualizarPreview();
      });
    }

    document.getElementById('grph-modal').style.display = 'flex';
  }

  function fecharModal() { document.getElementById('grph-modal').style.display = 'none'; }

  function _resetModal() {
    ['grph-m-search','grph-m-hostid','grph-m-hostname','grph-m-titulo',
     'grph-m-item-in-id','grph-m-item-in-search',
     'grph-m-item-out-id','grph-m-item-out-search'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    ['grph-m-badge','grph-m-item-in-badge','grph-m-item-out-badge','grph-m-preview'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    const results = document.getElementById('grph-m-results');
    if (results) results.style.display = 'none';
    const wrap = document.getElementById('grph-itens-wrap');
    if (wrap) wrap.style.display = 'none';
    ['grph-m-item-in-list','grph-m-item-out-list'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.innerHTML = ''; el.style.display = 'none'; }
    });
  }

  // ─────────────────────────────────────────────────────────
  // HOST SEARCH
  // ─────────────────────────────────────────────────────────
  function hostSearchDebounce(q) {
    clearTimeout(_hostTimer);
    _hostTimer = setTimeout(() => _buscarHosts(q), 300);
  }

  async function _buscarHosts(q) {
    const box = document.getElementById('grph-m-results');
    if (!q || q.length < 2) { box.style.display = 'none'; return; }
    const data = await _get(`${URLS.zbxHosts}?id=${clienteId}&q=${encodeURIComponent(q)}`);
    if (data.error || !data.hosts?.length) {
      box.innerHTML = '<div class="grph-ri"><span style="color:#64748b">Nenhum host encontrado</span></div>';
    } else {
      box.innerHTML = data.hosts.map(h => `
        <div class="grph-ri" onclick="GRAPH.selecionarHost('${h.hostid}','${(h.name||h.host).replace(/'/g,"\\'")}')">
          <div class="grph-ri-main">
            <span class="grph-ri-dot" style="background:${h.available==='up'?'#3fb950':'#ef4444'}"></span>
            <span>${h.name || h.host}</span>
          </div>
          <small>${h.ip} — <b style="color:${h.available==='up'?'#3fb950':'#ef4444'}">${h.available}</b></small>
        </div>`).join('');
    }
    box.style.display = 'block';
  }

  function selecionarHost(hostid, name) {
    document.getElementById('grph-m-hostid').value   = hostid;
    document.getElementById('grph-m-hostname').value = name;
    document.getElementById('grph-m-search').value   = name;
    document.getElementById('grph-m-results').style.display = 'none';
    const badge = document.getElementById('grph-m-badge');
    badge.textContent = `✓ ${name}`; badge.style.display = 'block';

    ['in','out'].forEach(d => {
      const id = document.getElementById(`grph-m-item-${d}-id`);
      const s  = document.getElementById(`grph-m-item-${d}-search`);
      const b  = document.getElementById(`grph-m-item-${d}-badge`);
      if (id) id.value = ''; if (s) s.value = ''; if (b) b.style.display = 'none';
    });
    const prev = document.getElementById('grph-m-preview');
    if (prev) prev.style.display = 'none';

    _carregarItens(hostid);
  }

  async function _carregarItens(hostid) {
    const wrap   = document.getElementById('grph-itens-wrap');
    const inList = document.getElementById('grph-m-item-in-list');
    const outList= document.getElementById('grph-m-item-out-list');

    if (wrap) wrap.style.display = 'block';
    const loading = '<div class="grph-ri"><span style="color:#475569">Buscando itens…</span></div>';
    if (inList)  { inList.innerHTML  = loading; inList.style.display  = 'block'; }
    if (outList) { outList.innerHTML = loading; outList.style.display = 'block'; }

    if (itensCache[hostid]) {
      _renderItens(itensCache[hostid]);
      _autoDetectar(itensCache[hostid]);
      return;
    }

    try {
      const data = await _get(`${URLS.zbxItens}?cliente_id=${clienteId}&host_id=${hostid}`);
      if (data.error || !data.itens?.length) {
        const msg = '<div class="grph-ri"><span style="color:#ef4444">Nenhum item numérico encontrado</span></div>';
        if (inList)  inList.innerHTML  = msg;
        if (outList) outList.innerHTML = msg;
        return;
      }
      itensCache[hostid] = data.itens;
      _renderItens(data.itens);
      _autoDetectar(data.itens);
    } catch(e) {
      const msg = `<div class="grph-ri"><span style="color:#ef4444">Erro: ${e.message}</span></div>`;
      if (inList)  inList.innerHTML  = msg;
      if (outList) outList.innerHTML = msg;
    }
  }

  function _autoDetectar(itens) {
    const inId  = document.getElementById('grph-m-item-in-id').value;
    const outId = document.getElementById('grph-m-item-out-id').value;
    if (inId && outId) return;

    if (!inId) {
      const inItem = itens.find(i => {
        const n = i.name.toLowerCase();
        return n.includes('bits received') || n.includes('bit receiv') ||
               n.includes('traffic in')   || n.includes('entrada');
      });
      if (inItem) _selecionarItemInterno('in', inItem);
    }
    if (!outId) {
      const outItem = itens.find(i => {
        const n = i.name.toLowerCase();
        return n.includes('bits sent') || n.includes('bit sent') ||
               n.includes('traffic out') || n.includes('saída');
      });
      if (outItem) _selecionarItemInterno('out', outItem);
    }
    _atualizarPreview();
  }

  function _renderItens(itens, filtro, direcao) {
    const dirs = direcao ? [direcao] : ['in', 'out'];
    const f = (filtro || '').toLowerCase();
    dirs.forEach(dir => {
      const list = document.getElementById(`grph-m-item-${dir}-list`);
      if (!list) return;
      const filtered = f ? itens.filter(i => i.name.toLowerCase().includes(f) || i.key.toLowerCase().includes(f)) : itens;
      if (!filtered.length) {
        list.innerHTML = '<div class="grph-ri"><span style="color:#475569">Nenhum item</span></div>';
        list.style.display = 'block';
        return;
      }
      list.innerHTML = filtered.map(i => {
        const lastVal = i.lastvalue ? ` <span style="color:#475569;font-size:.68rem">${i.lastvalue} ${i.units}</span>` : '';
        const itemJson = JSON.stringify(i).replace(/"/g, '&quot;');
        return `<div class="grph-ri" onclick="grphSelecionarItem('${dir}', '${itemJson}')">
          <div class="grph-ri-main">${i.name}${lastVal}</div>
          <small>${i.key}</small>
        </div>`;
      }).join('');
      list.style.display = 'block';
    });
  }

  function filtrarItens(direcao, valor) {
    const hostid = document.getElementById('grph-m-hostid').value;
    const itens  = itensCache[hostid];
    if (!itens) return;
    _renderItens(itens, valor, direcao);
  }

  function selecionarItem(direcao, itemJson) {
    let item = itemJson;
    if (typeof item === 'string') {
      try { item = JSON.parse(item.replace(/&quot;/g, '"')); } catch { return; }
    }
    _selecionarItemInterno(direcao, item);
    _atualizarPreview();
  }

  function _selecionarItemInterno(direcao, item) {
    const idEl     = document.getElementById(`grph-m-item-${direcao}-id`);
    const searchEl = document.getElementById(`grph-m-item-${direcao}-search`);
    const badgeEl  = document.getElementById(`grph-m-item-${direcao}-badge`);
    const listEl   = document.getElementById(`grph-m-item-${direcao}-list`);
    if (idEl)     idEl.value     = item.itemid;
    if (searchEl) searchEl.value = item.name;
    if (badgeEl)  { badgeEl.textContent = `✓ ${item.name}`; badgeEl.style.display = 'block'; }
    if (listEl)   listEl.style.display  = 'none';
  }

  function _atualizarPreview() {
    const inId  = document.getElementById('grph-m-item-in-id').value;
    const outId = document.getElementById('grph-m-item-out-id').value;
    const prev  = document.getElementById('grph-m-preview');
    if (!prev) return;
    if (inId || outId) {
      prev.style.display = 'block';
      prev.innerHTML =
        `<div class="grph-preview-row"><span>In Item ID</span><b style="color:#3fb950">${inId || '<span style="color:#64748b">—</span>'}</b></div>` +
        `<div class="grph-preview-row"><span>Out Item ID</span><b style="color:#58a6ff">${outId || '<span style="color:#64748b">—</span>'}</b></div>`;
    } else {
      prev.style.display = 'none';
    }
  }

  // ─────────────────────────────────────────────────────────
  // SALVAR / REMOVER
  // ─────────────────────────────────────────────────────────
  async function salvarChart() {
    const hostid   = document.getElementById('grph-m-hostid').value;
    const hostname = document.getElementById('grph-m-hostname').value;
    const inId     = document.getElementById('grph-m-item-in-id').value  || null;
    const outId    = document.getElementById('grph-m-item-out-id').value || null;
    const titulo   = (document.getElementById('grph-m-titulo') || {}).value?.trim() || '';

    if (!hostid)         { alert('Selecione um host.'); return; }
    if (!inId && !outId) { alert('Selecione pelo menos um item (Download ou Upload).'); return; }

    const itens     = itensCache[hostid] || [];
    const inItem    = itens.find(i => i.itemid === inId);
    const outItem   = itens.find(i => i.itemid === outId);
    const ifaceName = inItem?.name || outItem?.name || '—';

    if (_editingChart !== null) {
      const c = charts.find(x => x.id === _editingChart);
      if (c) {
        if (c._interval)     clearInterval(c._interval);
        if (c.chartInstance) c.chartInstance.destroy();
        Object.assign(c, {
          hostid, hostname, titulo, ifaceName,
          inId, outId, hours: c.hours || 1,
          chartInstance: null, _interval: null,
        });
      }
    } else {
      // Adiciona à aba ativa
      _activeTab().charts.push({
        id: nextChartId++, hostid, hostname, titulo, ifaceName,
        inId, outId, hours: 1,
        chartInstance: null, fsChartInstance: null, _interval: null, _fsSync: false,
      });
      _sync();
    }
    fecharModal();
    _salvarStorage();
    _renderTabBar();   // atualiza badge de contagem
    _renderGrid();
  }

  function removerChart(id) {
    const tab = _activeTab();
    const idx = tab.charts.findIndex(c => c.id === id);
    if (idx === -1) return;
    const c = tab.charts[idx];
    if (c._interval)     clearInterval(c._interval);
    if (c.chartInstance) c.chartInstance.destroy();
    if (_fullscreenId === id) fecharFullscreen();
    tab.charts.splice(idx, 1);
    _sync();
    _salvarStorage();
    _renderTabBar();   // atualiza badge de contagem
    _renderGrid();
  }

  // ─────────────────────────────────────────────────────────
  // UTILS
  // ─────────────────────────────────────────────────────────
  function _fmtBps(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    v = parseFloat(v);
    if (v >= 1e9) return `${(v/1e9).toFixed(2)} Gbps`;
    if (v >= 1e6) return `${(v/1e6).toFixed(2)} Mbps`;
    if (v >= 1e3) return `${(v/1e3).toFixed(1)} Kbps`;
    return `${v.toFixed(0)} bps`;
  }

  function _fmtTime(ts) {
    const d = new Date(ts * 1000);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  // ─────────────────────────────────────────────────────────
  function _getN() { return charts.length; }

  return {
    init, abrirModalAdd, abrirModalEdit, fecharModal,
    hostSearchDebounce, selecionarHost,
    filtrarItens, selecionarItem,
    salvarChart, removerChart, atualizarTodos,
    toggleFullscreen, fecharFullscreen,
    setPeriod, setFsPeriod,
    // Abas
    trocarAba, criarAba, removerAba, renomearAba, iniciarRenomear,
    _abrirCtxMenu,
    _getN,
  };
})();

window.GRAPH = GRAPH;
</script>
