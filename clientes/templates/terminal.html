<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal SSH Múltiplo - CONEXA</title>
    
    <!-- XTerm CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    
    <!-- JetBrains Mono Font -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }
        
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-weight: 400;
            font-size: 13px;
            line-height: 1.2;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        .terminal-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        
        /* HEADER */
        .terminal-header {
            background: rgba(0, 20, 10, 0.8);
            border-bottom: 2px solid #00ff88;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 60px;
            flex-shrink: 0;
        }
        
        .terminal-title {
            font-size: 14px;
            font-weight: 600;
            color: #00ff88;
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .terminal-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
        }
        
        .terminal-status.connected {
            color: #00ff88;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
            animation: pulse 1s infinite;
        }
        
        .status-dot.connected {
            background: #00ff88;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* TABS */
        .terminal-tabs {
            display: flex;
            background: #000;
            border-bottom: 1px solid #222;
            overflow-x: auto;
            gap: 5px;
            padding: 8px 10px;
            min-height: 40px;
            flex-shrink: 0;
        }
        
        .terminal-tab {
            background: rgba(50, 50, 50, 0.5);
            border: 1px solid #333;
            border-bottom: none;
            color: #888;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .terminal-tab:hover {
            background: rgba(100, 100, 100, 0.5);
            color: #00ff88;
        }
        
        .terminal-tab.active {
            background: #0a0a0a;
            border: 1px solid #00ff88;
            border-bottom: 1px solid #0a0a0a;
            color: #00ff88;
        }
        
        .terminal-tab-close {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        
        .terminal-tab-close:hover {
            color: #ff4444;
            opacity: 1;
        }
        
        .terminal-tab-status {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #888;
        }
        
        .terminal-tab-status.connected {
            background: #00ff88;
        }
        
        /* CONTEÚDO - CRÍTICO */
        .terminal-content {
            flex: 1;
            overflow: hidden;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }
        
        .terminal-pane {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            position: relative;
            min-height: 0;
            min-width: 0;
        }
        
        .terminal-pane.active {
            display: flex;
        }
        
        /* ✅ CRÍTICO: xterm DEVE TER TAMANHO DEFINIDO */
        .xterm {
            flex: 1;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: relative;
            min-height: 0;
            min-width: 0;
        }
        
        .xterm-screen {
            width: 100%;
            height: 100%;
        }
        
        /* Melhorar renderização do xterm */
        .xterm-viewport {
            background-color: #000;
        }
        
        .xterm-char-measure-element {
            display: inline-block;
            position: absolute;
            visibility: hidden;
            left: -9999px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
            font-size: 13px;
            line-height: 1.2;
        }
        
        /* FOOTER */
        .terminal-footer {
            background: rgba(0, 20, 10, 0.5);
            border-top: 1px solid #333;
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 50px;
            flex-shrink: 0;
        }
        
        .btn-terminal {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            transition: 0.2s;
            text-transform: uppercase;
        }
        
        .btn-terminal:hover {
            border-color: #00ff88;
            color: #00ff88;
        }
        
        /* ESTADO VAZIO */
        .terminal-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-size: 14px;
            gap: 15px;
        }
        
        .terminal-empty-text {
            text-align: center;
            line-height: 1.6;
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* DEBUG PANEL */
        .debug-panel {
            display: none !important;
        }
        
        .debug-line {
            margin: 2px 0;
            padding: 2px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <!-- Header -->
        <div class="terminal-header">
            <div class="terminal-title">
                ▶ Terminal SSH Múltiplo CONEXA
            </div>
            <div class="terminal-status connected" id="terminalStatus">
                <div class="status-dot connected"></div>
                <span id="statusText">Pronto para conexões</span>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="terminal-tabs" id="terminalTabs">
            <!-- Tabs adicionadas aqui -->
        </div>
        
        <!-- Conteúdo -->
        <div class="terminal-content" id="terminalContent" style="flex: 1; min-height: 0;">
            <div class="terminal-pane active">
                <div class="terminal-empty">
                    <div>⏳</div>
                    <div class="terminal-empty-text">
                        <p>Nenhum terminal conectado</p>
                        <p style="font-size: 11px; color: #777;">Clique em "Acessar" na página principal para abrir um terminal</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="terminal-footer">
            <button class="btn-terminal" onclick="limparTela()">
                ✕ Limpar Tela
            </button>
            <button class="btn-terminal" onclick="window.location.reload()">
                ↻ Atualizar
            </button>
            <button class="btn-terminal" onclick="fecharTodosTerminais()">
                ⏻ Fechar Todos
            </button>
            <button class="btn-terminal" onclick="window.close()">
                ✕ Fechar Aba
            </button>
        </div>
    </div>
    
    <!-- DEBUG PANEL -->
    <div class="debug-panel" id="debugPanel" style="display: none;">
        <div style="color: #00ff88; margin-bottom: 5px;"><strong>DEBUG</strong></div>
        <div id="debugOutput"></div>
    </div>
    
    <!-- XTerm JS -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

    <script>
        // ============================================
        // DEBUG HELPER - DESABILITADO
        // ============================================
        
        const DEBUG = false;
        const debugLines = [];
        
        function addDebug(msg) {
            if (DEBUG) {
                debugLines.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
                
                if (debugLines.length > 20) {
                    debugLines.shift();
                }
                
                const debugPanel = document.getElementById('debugPanel');
                if (debugPanel) {
                    debugPanel.style.display = 'block';
                    const output = document.getElementById('debugOutput');
                    if (output) {
                        output.innerHTML = debugLines.map(l => 
                            '<div class="debug-line">' + l.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>'
                        ).join('');
                        output.scrollTop = output.scrollHeight;
                    }
                }
                
                console.log(msg);
            }
        }
        
        // ============================================
        // COLORIZAÇÃO SEGURA - SEM BUGAR O TERMINAL
        // ============================================
        
        const COLORS = {
            RESET: '\x1b[0m',
            
            // IPv4 e IPv6 - Azul Brilhante
            IPV4: '\x1b[1;94m',     // Bold Bright Blue
            IPV6: '\x1b[1;94m',     // Bold Bright Blue
            
            // Protocolos - Ciano
            PROTOCOL: '\x1b[36m',   // Cyan
            
            // Estados BGP
            ESTABLISHED: '\x1b[92m', // Bright Green
            IDLE: '\x1b[93m',        // Bright Yellow
            ACTIVE: '\x1b[91m',      // Bright Red
            EXSTART: '\x1b[93m',     // Bright Yellow
            EXCHANGE: '\x1b[96m',    // Bright Cyan
            LOADING: '\x1b[94m',     // Bright Blue
            INIT: '\x1b[91m',        // Bright Red
            DOWN: '\x1b[31m',        // Red
            TWOWAY: '\x1b[93m',      // Bright Yellow
            OPEN_SENT: '\x1b[93m',   // Bright Yellow
            OPEN_CONFIRM: '\x1b[96m', // Bright Cyan
            
            // UP - Verde Brilhante
            UP: '\x1b[92m',          // Bright Green
            
            // Network - Cyan
            NETWORK: '\x1b[36m',
            
            // BFD - Magenta
            BFD: '\x1b[95m',
            
            // Keywords
            KEYWORDS: '\x1b[36m',
        };
        
        function colorizeOutput(text) {
            if (!text) return text;
            
            // ✅ ESTRATÉGIA SEGURA: Usar .replace() simples
            // Não usa loop, não modifica comprimento relativo
            
            let result = text;
            
            // 1️⃣ IPv4 - Azul Brilhante
            result = result.replace(
                /\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\/\d{1,2})?\b/g,
                match => COLORS.IPV4 + match + COLORS.RESET
            );
            
            // 2️⃣ IPv6 - Azul Brilhante
            result = result.replace(
                /(?:[0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4}(?:\/\d{1,3})?/g,
                match => COLORS.IPV6 + match + COLORS.RESET
            );
            
            // 3️⃣ Protocolos - Ciano
            result = result.replace(
                /\b(BGP|OSPF|OSPFv3|EIGRP|RIP|ISIS)\b/gi,
                match => COLORS.PROTOCOL + match + COLORS.RESET
            );
            
            // 4️⃣ BFD - Magenta
            result = result.replace(
                /\b(BFD|bfd)\b/g,
                match => COLORS.BFD + match + COLORS.RESET
            );
            
            // 5️⃣ NETWORK - Cyan
            result = result.replace(
                /\b(network|Network|NETWORK)\b/g,
                match => COLORS.NETWORK + match + COLORS.RESET
            );
            
            // 6️⃣ Estados BGP - Diferentes cores
            
            // ESTABLISHED - Verde
            result = result.replace(
                /\b(Established|established|ESTABLISHED)\b/g,
                match => COLORS.ESTABLISHED + match + COLORS.RESET
            );
            
            // IDLE - Amarelo
            result = result.replace(
                /\b(Idle|idle|IDLE)(?!\()/g,
                match => COLORS.IDLE + match + COLORS.RESET
            );
            
            // ACTIVE - Vermelho
            result = result.replace(
                /\b(Active|active|ACTIVE)\b/g,
                match => COLORS.ACTIVE + match + COLORS.RESET
            );
            
            // ExStart - Amarelo
            result = result.replace(
                /\b(ExStart|exstart|EXSTART)\b/g,
                match => COLORS.EXSTART + match + COLORS.RESET
            );
            
            // Exchange - Ciano
            result = result.replace(
                /\b(Exchange|exchange|EXCHANGE)\b/g,
                match => COLORS.EXCHANGE + match + COLORS.RESET
            );
            
            // Loading - Azul
            result = result.replace(
                /\b(Loading|loading|LOADING)\b/g,
                match => COLORS.LOADING + match + COLORS.RESET
            );
            
            // Init - Vermelho
            result = result.replace(
                /\b(Init|init|INIT)\b/g,
                match => COLORS.INIT + match + COLORS.RESET
            );
            
            // Down - Vermelho
            result = result.replace(
                /\b(Down|down|DOWN)\b/g,
                match => COLORS.DOWN + match + COLORS.RESET
            );
            
            // 2-Way - Amarelo
            result = result.replace(
                /\b(2-Way|2-way|2WAY)\b/g,
                match => COLORS.TWOWAY + match + COLORS.RESET
            );
            
            // OpenSent - Amarelo
            result = result.replace(
                /\b(OpenSent|opensent|OPENSENT)\b/g,
                match => COLORS.OPEN_SENT + match + COLORS.RESET
            );
            
            // OpenConfirm - Ciano
            result = result.replace(
                /\b(OpenConfirm|openconfirm|OPENCONFIRM)\b/g,
                match => COLORS.OPEN_CONFIRM + match + COLORS.RESET
            );
            
            // 7️⃣ Keywords - Cyan
            result = result.replace(
                /\b(peer|Peer|PEER|neighbor|Neighbor|NEIGHBOR|neighbors|Neighbors|NEIGHBORS)\b/g,
                match => COLORS.KEYWORDS + match + COLORS.RESET
            );
            
            // 8️⃣ UP - Verde Brilhante
            result = result.replace(
                /\b(up|Up|UP)\b/g,
                match => COLORS.UP + match + COLORS.RESET
            );
            
            return result;
        }
        
        // ============================================
        // TERMINAL MANAGER
        // ============================================
        
        class TerminalManager {
            constructor() {
                this.terminals = new Map();
                this.activeTerminal = null;
                this.tabCounter = 0;
                this.wsRetryCount = 0;
                this.maxRetries = 3;
                this.retryDelay = 2000;
                
                addDebug('🚀 TerminalManager inicializando...');
                
                this.verificarAcessoPendente();
                
                window.addEventListener('message', (e) => this.handleMessage(e));
                
                setInterval(() => this.limparTerminaisDesconectados(), 5000);
                
                addDebug('✅ TerminalManager pronto');
            }
            
            verificarAcessoPendente() {
                try {
                    let acessoPendente = localStorage.getItem('acessoPendente');
                    
                    if (acessoPendente) {
                        const acesso = JSON.parse(acessoPendente);
                        localStorage.removeItem('acessoPendente');
                        
                        addDebug('📂 Acesso pendente encontrado: ' + acesso.tipo);
                        
                        setTimeout(() => {
                            this.abrirTerminal(acesso);
                        }, 500);
                    } else {
                        addDebug('⚠️ Nenhum acesso pendente');
                    }
                } catch (e) {
                    addDebug('❌ Erro ao verificar acesso: ' + e.message);
                }
            }
            
            handleMessage(event) {
                if (event.data && event.data.type === 'NOVA_CONEXAO') {
                    addDebug('📬 Nova conexão via postMessage: ' + event.data.acesso.tipo);
                    this.abrirTerminal(event.data.acesso);
                    window.focus();
                }
            }
            
            abrirTerminal(acessoData) {
                const terminalId = `terminal-${++this.tabCounter}`;
                
                addDebug(`📂 Abrindo terminal ${terminalId}: ${acessoData.tipo}`);
                addDebug(`   Host: ${acessoData.host}:${acessoData.porta}`);
                
                try {
                    // ✅ CRIAR TERMINAL XTERM COM JETBRAINS MONO
                    const terminal = new Terminal({
                        cursorBlink: true,
                        fontSize: 13,
                        fontFamily: "'JetBrains Mono', 'Courier New', monospace",
                        fontWeight: 400,
                        fontWeightBold: 600,
                        lineHeight: 1.2,
                        letterSpacing: 0,
                        theme: { 
                            background: '#000000', 
                            foreground: '#ffffff',
                            cursor: '#ffffff',
                            cursorAccent: '#000000'
                        },
                        scrollback: 5000,
                        rows: 24,
                        cols: 120,
                        allowTransparency: true,
                        windowsMode: false,
                        convertEol: true
                    });
                    
                    addDebug('✅ Terminal xterm criado com JetBrains Mono');
                    
                    const fitAddon = new FitAddon.FitAddon();
                    terminal.loadAddon(fitAddon);
                    
                    addDebug('✅ FitAddon carregado');
                    
                    // ✅ CAPTURAR CTRL+W PARA NÃO FECHAR O TERMINAL WEB
                    terminal.attachCustomKeyEventHandler((arg) => {
                        // Se for Ctrl+W (W = 87), enviar ao terminal Linux
                        if (arg.ctrlKey && arg.keyCode === 87) {
                            addDebug('⌨️ Ctrl+W capturado - Enviando ao terminal Linux');
                            // Retornar false para não processar no navegador
                            return false;
                        }
                        // Deixar outros atalhos funcionarem normalmente
                        return true;
                    });
                    
                    // ✅ CRIAR PANE
                    const pane = document.createElement('div');
                    pane.className = 'terminal-pane';
                    pane.id = `pane-${terminalId}`;
                    pane.style.flex = '1';
                    pane.style.overflow = 'hidden';
                    pane.style.display = 'none';
                    pane.style.minHeight = '0';
                    pane.style.minWidth = '0';
                    
                    addDebug('✅ Pane criado: ' + pane.id);
                    
                    // ✅ ADICIONAR AO DOM
                    const content = document.getElementById('terminalContent');
                    
                    const panesAnteriores = content.querySelectorAll('.terminal-pane.active');
                    panesAnteriores.forEach(paneAnterior => {
                        paneAnterior.classList.remove('active');
                        paneAnterior.style.display = 'none';
                    });
                    
                    content.appendChild(pane);
                    
                    addDebug('✅ Pane adicionado ao DOM');
                    
                    // ✅ ABRIR TERMINAL NO PANE
                    terminal.open(pane);
                    
                    addDebug('✅ Terminal aberto no pane');
                    
                    // Armazenar
                    const terminalObj = {
                        id: terminalId,
                        terminal: terminal,
                        fitAddon: fitAddon,
                        pane: pane,
                        acesso: acessoData,
                        socket: null,
                        connected: false,
                        wsRetries: 0
                    };
                    
                    this.terminals.set(terminalId, terminalObj);
                    
                    // ✅ CRIAR ABA
                    this.criarAba(terminalId, acessoData);
                    
                    // ✅ ATIVAR
                    this.ativarTerminal(terminalId);
                    
                    // Welcome message
                    terminal.writeln('\x1b[1;36m▶ CONEXA Terminal SSH\x1b[0m');
                    terminal.writeln('\x1b[1;36m▶ Conectando a ' + acessoData.host + ':' + acessoData.porta + '...\x1b[0m\n');
                    
                    addDebug('✅ Mensagem de boas-vindas enviada');
                    
                    // Input do terminal
                    terminal.onData((input) => {
                        if (terminalObj.socket && terminalObj.socket.readyState === WebSocket.OPEN) {
                            terminalObj.socket.send(JSON.stringify({
                                action: 'command',
                                command: input
                            }));
                        }
                    });
                    
                    // Conectar WebSocket
                    setTimeout(() => this.conectarWebSocket(terminalId), 200);
                    
                } catch (e) {
                    addDebug('❌ Erro ao abrir terminal: ' + e.message);
                    console.error(e);
                }
            }
            
            criarAba(terminalId, acessoData) {
                const tabs = document.getElementById('terminalTabs');
                
                const tab = document.createElement('div');
                tab.className = 'terminal-tab active';
                tab.id = `tab-${terminalId}`;
                
                tab.innerHTML = `
                    <div class="terminal-tab-status connected"></div>
                    <span>${acessoData.tipo} - ${acessoData.host}</span>
                    <span class="terminal-tab-close" onclick="event.stopPropagation(); terminalManager.fecharTerminal('${terminalId}')">✕</span>
                `;
                
                tab.onclick = () => this.ativarTerminal(terminalId);
                tabs.appendChild(tab);
                
                addDebug('✅ Aba criada: ' + terminalId);
            }
            
            ativarTerminal(terminalId) {
                if (this.activeTerminal) {
                    const anterior = this.terminals.get(this.activeTerminal);
                    if (anterior) {
                        anterior.pane.classList.remove('active');
                        anterior.pane.style.display = 'none';
                        const tabAnterior = document.getElementById(`tab-${this.activeTerminal}`);
                        if (tabAnterior) tabAnterior.classList.remove('active');
                    }
                }
                
                this.activeTerminal = terminalId;
                const terminalObj = this.terminals.get(terminalId);
                
                if (terminalObj) {
                    terminalObj.pane.classList.add('active');
                    terminalObj.pane.style.display = 'flex';
                    
                    const tab = document.getElementById(`tab-${terminalId}`);
                    if (tab) tab.classList.add('active');
                    
                    setTimeout(() => {
                        try {
                            terminalObj.fitAddon.fit();
                            addDebug(`✅ Terminal ${terminalId} dimensionado e focado`);
                        } catch (e) {
                            addDebug('⚠️ Erro ao fazer fit: ' + e.message);
                        }
                        terminalObj.terminal.focus();
                    }, 50);
                    
                    addDebug(`👁️ Terminal ativado: ${terminalId}`);
                }
            }
            
            conectarWebSocket(terminalId) {
                const terminalObj = this.terminals.get(terminalId);
                if (!terminalObj) return;
                
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws/ssh/`;
                
                addDebug('🔌 Conectando WebSocket: ' + wsUrl);
                
                try {
                    terminalObj.socket = new WebSocket(wsUrl);
                    
                    terminalObj.socket.onopen = () => {
                        addDebug('✅ WebSocket conectado');
                        terminalObj.terminal.writeln('\x1b[1;32m▶ WebSocket conectado\x1b[0m\n');
                        terminalObj.wsRetries = 0;
                        
                        terminalObj.socket.send(JSON.stringify({
                            action: 'connect',
                            acesso_id: terminalObj.acesso.id
                        }));
                        
                        addDebug('📤 Enviado: action=connect, acesso_id=' + terminalObj.acesso.id);
                    };
                    
                    terminalObj.socket.onmessage = (e) => {
                        const data = JSON.parse(e.data);
                        
                        if (data.type === 'connected') {
                            terminalObj.connected = true;
                            const tab = document.getElementById(`tab-${terminalId}`);
                            if (tab) tab.querySelector('.terminal-tab-status').classList.add('connected');
                            
                            terminalObj.terminal.writeln('\x1b[1;32m✓ ' + data.message + '\x1b[0m\n');
                            addDebug('✅ Conectado: ' + data.message);
                            
                        } else if (data.type === 'output' && data.data) {
                            // ✅ ESCREVER OUTPUT COM COLORIZAÇÃO
                            const colorizedData = colorizeOutput(data.data);
                            terminalObj.terminal.write(colorizedData);
                            
                        } else if (data.type === 'error') {
                            terminalObj.connected = false;
                            terminalObj.terminal.writeln('\x1b[1;31m✕ ERRO: ' + data.message + '\x1b[0m\n');
                            addDebug('❌ Erro: ' + data.message);
                        }
                    };
                    
                    terminalObj.socket.onerror = (error) => {
                        addDebug('❌ WebSocket erro');
                        terminalObj.terminal.writeln('\x1b[1;31m✕ Erro na conexão\x1b[0m\n');
                    };
                    
                    terminalObj.socket.onclose = () => {
                        addDebug('🔌 WebSocket fechado');
                        terminalObj.connected = false;
                        
                        if (terminalObj.wsRetries < this.maxRetries) {
                            terminalObj.wsRetries++;
                            addDebug(`🔄 Reconectando (${terminalObj.wsRetries}/${this.maxRetries})...`);
                            setTimeout(() => this.conectarWebSocket(terminalId), this.retryDelay);
                        }
                    };
                    
                } catch (e) {
                    addDebug('❌ Erro ao criar WebSocket: ' + e.message);
                }
            }
            
            fecharTerminal(terminalId) {
                const terminalObj = this.terminals.get(terminalId);
                if (!terminalObj) return;
                
                if (terminalObj.socket) {
                    terminalObj.socket.close();
                }
                
                terminalObj.terminal.dispose();
                terminalObj.pane.remove();
                const tab = document.getElementById(`tab-${terminalId}`);
                if (tab) tab.remove();
                
                this.terminals.delete(terminalId);
                
                if (this.activeTerminal === terminalId) {
                    const proximoId = Array.from(this.terminals.keys())[0];
                    if (proximoId) {
                        this.ativarTerminal(proximoId);
                    } else {
                        this.activeTerminal = null;
                    }
                }
                
                addDebug('🔴 Terminal fechado: ' + terminalId);
            }
            
            fecharTodos() {
                Array.from(this.terminals.keys()).forEach(id => {
                    this.fecharTerminal(id);
                });
            }
            
            limparTerminaisDesconectados() {
                // Implementação...
            }
        }
        
        // Inicializar
        const terminalManager = new TerminalManager();
        
        function limparTela() {
            if (terminalManager.activeTerminal) {
                const terminalObj = terminalManager.terminals.get(terminalManager.activeTerminal);
                if (terminalObj) {
                    terminalObj.terminal.clear();
                    addDebug('🧹 Tela do terminal ' + terminalManager.activeTerminal + ' foi limpa');
                }
            }
        }
        
        function fecharTodosTerminais() {
            terminalManager.fecharTodos();
        }
        
        // Resize
        window.addEventListener('resize', () => {
            if (terminalManager.activeTerminal) {
                const terminalObj = terminalManager.terminals.get(terminalManager.activeTerminal);
                if (terminalObj) {
                    try {
                        terminalObj.fitAddon.fit();
                    } catch (e) {
                        console.error('Erro no resize:', e);
                    }
                }
            }
        });
        
        // Forçar fit ao carregar
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (terminalManager.activeTerminal) {
                    const terminalObj = terminalManager.terminals.get(terminalManager.activeTerminal);
                    if (terminalObj) {
                        terminalObj.fitAddon.fit();
                    }
                }
            }, 100);
        });
        
        addDebug('🚀 Terminal SSH Múltiplo carregado com JetBrains Mono');
    </script>
