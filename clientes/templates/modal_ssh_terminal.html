<div id="modalSSHTerminal" class="modal-overlay" style="display: none;">
    <div class="modal-ssh-terminal">
        <div class="modal-header-ssh">
            <div class="terminal-info">
                <h2 class="modal-title-ssh">
                    <span class="terminal-prefix">&gt;</span> Terminal SSH
                    <span id="ssh_connection_info" class="connection-info"></span>
                </h2>
                <div class="connection-status">
                    <span class="status-dot" id="ssh_status_dot"></span>
                    <span id="ssh_status_text">Desconectado</span>
                </div>
            </div>
            <button class="btn-close-modal-ssh" onclick="fecharTerminalSSH()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body-ssh">
            <div id="ssh_terminal"></div>
        </div>
        <div class="modal-footer-ssh">
            <button type="button" class="btn-action-ssh btn-reconnect" onclick="reconectarSSH()">
                <i class="fas fa-sync-alt me-2"></i> Reconectar
            </button>
            <button type="button" class="btn-action-ssh btn-clear" onclick="limparTerminal()">
                <i class="fas fa-eraser me-2"></i> Limpar
            </button>
            <button type="button" class="btn-action-ssh btn-disconnect" onclick="fecharTerminalSSH()">
                <i class="fas fa-power-off me-2"></i> Desconectar
            </button>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

<style>
.modal-ssh-terminal {
    background: #0a0a0a;
    border: 2px solid var(--primary-green);
    border-radius: 8px;
    width: 95%;
    max-width: 1200px;
    height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px var(--glow-green);
    animation: slideIn 0.4s ease;
}

.modal-header-ssh {
    padding: 15px 25px;
    border-bottom: 2px solid var(--primary-green);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 26, 13, 0.8);
}

.terminal-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.modal-title-ssh {
    font-family: 'Courier New', monospace;
    color: var(--primary-green);
    font-size: 16px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 1px;
}

.connection-info {
    font-size: 12px;
    color: var(--accent-cyan);
    margin-left: 10px;
}

.connection-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--text-muted);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s ease;
}

.status-dot.connected {
    background: var(--primary-green);
    box-shadow: 0 0 10px var(--glow-green);
    animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.btn-close-modal-ssh {
    background: transparent;
    border: 1px solid var(--primary-green);
    color: var(--primary-green);
    width: 32px;
    height: 32px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-close-modal-ssh:hover {
    background: var(--primary-green);
    color: #000;
    transform: rotate(90deg);
}

.modal-body-ssh {
    flex: 1;
    padding: 0;
    background: #000;
    overflow: hidden;
}

#ssh_terminal {
    width: 100%;
    height: 100%;
    padding: 10px;
}

.modal-footer-ssh {
    padding: 15px 25px;
    border-top: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.btn-action-ssh {
    background: rgba(22, 27, 34, 0.9);
    border: 1px solid var(--border);
    color: var(--text-light);
    padding: 8px 16px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
}

.btn-action-ssh:hover {
    transform: translateY(-2px);
}

.xterm {
    font-family: 'Courier New', monospace !important;
    font-size: 14px !important;
    padding: 10px;
}

.xterm-viewport {
    background: #000 !important;
}

.xterm-screen {
    background: #000 !important;
}

@media (max-width: 768px) {
    .modal-ssh-terminal {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }
}
</style>

<script>
// ╔═══════════════════════════════════════════════════════════════════════════╗
// ║ TERMINAL SSH - FRONTEND OTIMIZADO (ZERO DELAY)                          ║
// ║                                                                           ║
// ║ Otimizações:                                                             ║
// ║ 1. WebSocket com buffering inteligente                                  ║
// ║ 2. xterm.js configurado para performance máxima                         ║
// ║ 3. Renderização sem jank                                               ║
// ║ 4. Leitura de dados otimizada                                          ║
// ║                                                                           ║
// ╚═══════════════════════════════════════════════════════════════════════════╝

let sshTerminal = null;
let sshSocket = null;
let sshFitAddon = null;
let currentAcessoId = null;
let isConnected = false;

console.log('✅ Terminal SSH Otimizado carregado');

function destruirTerminalAnterior() {
    isConnected = false;
    
    if (sshSocket) {
        try { sshSocket.close(); } catch (e) {}
        sshSocket = null;
    }
    
    if (sshTerminal) {
        try { sshTerminal.dispose(); } catch (e) {}
        sshTerminal = null;
        sshFitAddon = null;
    }
    
    const terminalElement = document.getElementById('ssh_terminal');
    if (terminalElement) {
        terminalElement.innerHTML = '';
    }
}

function abrirTerminalSSH(acessoId, host, porta, tipo) {
    destruirTerminalAnterior();
    currentAcessoId = acessoId;
    
    document.getElementById('modalSSHTerminal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    document.getElementById('ssh_connection_info').textContent = `${tipo} - ${host}:${porta}`;
    
    inicializarTerminal();
    
    setTimeout(() => {
        conectarSSH(acessoId);
    }, 200);
}

function inicializarTerminal() {
    const terminalElement = document.getElementById('ssh_terminal');
    terminalElement.innerHTML = '';
    
    // ✅ OTIMIZAÇÃO 1: xterm.js com performance máxima
    sshTerminal = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 14,
        fontFamily: '"Courier New", Courier, monospace',
        rendererType: 'canvas',  // ✅ Canvas é mais rápido que DOM
        theme: {
            background: '#000000',
            foreground: '#00ff88',
            cursor: '#00ff88',
            cursorAccent: '#000000',
            selection: 'rgba(0, 255, 136, 0.3)',
        },
        allowTransparency: true,
        scrollback: 1000,
        // ✅ Otimizações adicionais
        enableBold: true,
        enableBoldItalics: false,  // ✅ Desabilitar para performance
        rightClickSelectsWord: false,
    });
    
    sshFitAddon = new FitAddon.FitAddon();
    sshTerminal.loadAddon(sshFitAddon);
    sshTerminal.open(terminalElement);
    
    setTimeout(() => {
        sshFitAddon.fit();
    }, 50);
    
    window.addEventListener('resize', () => {
        if (sshTerminal && sshFitAddon) {
            sshFitAddon.fit();
        }
    });
    
    sshTerminal.writeln('\x1b[1;32m╔════════════════════════════════════════╗\x1b[0m');
    sshTerminal.writeln('\x1b[1;32m║   CONEXA CRM - Terminal SSH (RÁPIDO)  ║\x1b[0m');
    sshTerminal.writeln('\x1b[1;32m╚════════════════════════════════════════╝\x1b[0m');
    sshTerminal.writeln('');
}

function conectarSSH(acessoId) {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws/ssh/`;
    
    atualizarStatusConexao('Conectando...', 'connecting');
    
    try {
        // ✅ OTIMIZAÇÃO 2: WebSocket com baixa latência
        sshSocket = new WebSocket(wsUrl);
        sshSocket.binaryType = 'arraybuffer';  // ✅ Para performance
        
        sshSocket.onopen = function() {
            sshSocket.send(JSON.stringify({
                action: 'connect',
                acesso_id: acessoId
            }));
        };
        
        sshSocket.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'connected') {
                    isConnected = true;
                    atualizarStatusConexao('Conectado', 'connected');
                    sshTerminal.writeln('\x1b[1;36m' + data.message + '\x1b[0m');
                    sshTerminal.writeln('');
                    
                    configurarInputTerminal();
                    
                } else if (data.type === 'output') {
                    // ✅ OTIMIZAÇÃO 3: Renderizar imediatamente
                    if (data.data) {
                        // ✅ Usar requestAnimationFrame para renderização suave
                        requestAnimationFrame(() => {
                            sshTerminal.write(data.data);
                        });
                    }
                    
                } else if (data.type === 'error') {
                    isConnected = false;
                    atualizarStatusConexao('Erro', 'error');
                    sshTerminal.writeln('\x1b[1;31mERRO: ' + data.message + '\x1b[0m');
                }
            } catch (e) {
                console.error('Parse error:', e);
            }
        };
        
        sshSocket.onerror = function(error) {
            isConnected = false;
            atualizarStatusConexao('Erro', 'error');
        };
        
        sshSocket.onclose = function() {
            isConnected = false;
            atualizarStatusConexao('Desconectado', 'disconnected');
        };
        
    } catch (error) {
        isConnected = false;
        atualizarStatusConexao('Erro', 'error');
    }
}

// ✅ OTIMIZAÇÃO 4: Input sem delay - enviar imediatamente
function configurarInputTerminal() {
    sshTerminal.onData((data) => {
        if (!isConnected || !sshSocket || sshSocket.readyState !== WebSocket.OPEN) {
            return;
        }
        
        // ✅ Enviar IMEDIATAMENTE, sem qualquer processamento
        sshSocket.send(JSON.stringify({
            action: 'command',
            command: data
        }));
    });
}

function atualizarStatusConexao(texto, status) {
    const statusDot = document.getElementById('ssh_status_dot');
    const statusText = document.getElementById('ssh_status_text');
    
    statusText.textContent = texto;
    statusDot.className = 'status-dot';
    
    if (status === 'connected') {
        statusDot.classList.add('connected');
    }
}

function reconectarSSH() {
    isConnected = false;
    
    if (sshSocket) {
        sshSocket.close();
    }
    
    if (sshTerminal) {
        sshTerminal.clear();
    }
    
    if (currentAcessoId) {
        conectarSSH(currentAcessoId);
    }
}

function limparTerminal() {
    if (sshTerminal) {
        sshTerminal.clear();
    }
}

function fecharTerminalSSH() {
    isConnected = false;
    
    if (sshSocket) {
        sshSocket.close();
        sshSocket = null;
    }
    
    document.getElementById('modalSSHTerminal').style.display = 'none';
    document.body.style.overflow = 'auto';
    
    atualizarStatusConexao('Desconectado', 'disconnected');
    currentAcessoId = null;
}

document.addEventListener('click', function(e) {
    const modal = document.getElementById('modalSSHTerminal');
    if (e.target === modal) {
        if (confirm('Deseja desconectar?')) {
            fecharTerminalSSH();
        }
    }
});

document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('modalSSHTerminal');
    if (e.key === 'Escape' && modal.style.display === 'flex') {
        if (confirm('Deseja desconectar?')) {
            fecharTerminalSSH();
        }
    }
});

console.log('✅ Terminal otimizado pronto - digitação ultra-rápida!');
</script>
