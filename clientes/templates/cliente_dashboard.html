{% extends "base_clientes.html" %}
{% load static %}

{% block content %}
<div class="main-content">
    <div class="container-fluid">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-5">
            <div>
                <h2 class="mb-2">{{ cliente.nome_empresa }}</h2>
            </div>
            <div style="background: rgba(63,185,80,0.2); color: #3fb950; padding: 12px 20px; border-radius: 6px; border: 1px solid #30363d; font-weight: bold;">
                👤 CLIENTE
            </div>
        </div>

        <!-- Botão para Acessos -->
        <div class="row">
            <div class="col-12">
                <button class="btn btn-lg btn-primary" onclick="irParaAcessos()" style="width: 100%; padding: 15px; font-size: 16px; font-weight: bold;">
                    <i class="fas fa-key me-2"></i> Ir para Acessos e Configurações
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function irParaAcessos() {
    window.location.href = 'https://crm.tomich.com.br/clientes/listar/?id={{ cliente.id }}';
}
</script>

{% endblock %}
