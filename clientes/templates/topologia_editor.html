<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Topologia — {{ cliente.nome_empresa }}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --green:#3fb950;--cyan:#00d9ff;--blue:#58a6ff;--orange:#ffa657;--red:#f85149;
  --purple:#bc8cff;--yellow:#e3b341;
  --accent-grad:linear-gradient(135deg,#00d9ff,#58a6ff);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
/* modo embed: esconde botão fechar */
body.embed-mode #btn-fechar{display:none!important}
/* ── Toolbar ── */
#toolbar{height:52px;background:var(--surface);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,rgba(0,217,255,.45),rgba(88,166,255,.12) 40%,transparent 75%) 1;display:flex;align-items:center;gap:6px;padding:0 14px;flex-shrink:0;z-index:10;box-shadow:var(--shadow-sm)}
#toolbar .tb-brand{display:flex;align-items:center;gap:8px;padding-right:10px;margin-right:2px;border-right:1px solid var(--border);color:var(--cyan);font-size:.85rem;font-weight:700;letter-spacing:.01em}
@media (max-width: 768px) {
    #toolbar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    #toolbar::-webkit-scrollbar { display: none; }
    .tb-btn { flex-shrink: 0; }
}
.tb-btn{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:.8rem;display:flex;align-items:center;gap:6px;transition:transform .12s,background .15s,border-color .15s,color .15s,box-shadow .15s}
.tb-btn:hover{background:rgba(255,255,255,.09);border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.tb-btn:active{transform:translateY(0)}
.tb-btn.active{background:rgba(0,217,255,.15);border-color:var(--cyan);color:var(--cyan)}
.tb-btn.danger:hover{border-color:var(--red);color:var(--red)}
.tb-btn.primary{background:var(--accent-grad);border-color:transparent;color:#04121a;font-weight:700;box-shadow:0 2px 10px rgba(0,217,255,.25)}
.tb-btn.primary:hover{filter:brightness(1.08);color:#04121a;transform:translateY(-1px)}
.tb-sep{width:1px;height:26px;background:var(--border);margin:0 4px}
#nome-diagrama{background:transparent;border:1px solid transparent;color:var(--text);font-size:.9rem;font-weight:600;padding:5px 9px;border-radius:6px;min-width:180px}
#nome-diagrama:hover{border-color:var(--border)}
#nome-diagrama:focus{border-color:var(--cyan);outline:none;background:var(--bg)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-cliente{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,255,255,.04);border-radius:20px;border:1px solid var(--border)}
.tb-cliente i{color:var(--cyan);font-size:.7rem}
/* ── Main layout ── */
#main{display:flex;flex:1;overflow:hidden}
/* ── Palette ── */
#palette{width:190px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.pal-title{padding:10px 12px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.02)}
.pal-group-title{padding:9px 12px 5px;font-size:.63rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.85}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 6px;border-radius:8px;cursor:grab;transition:transform .12s,background .15s,box-shadow .15s;user-select:none}
.pal-item:hover{background:rgba(255,255,255,.06);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.pal-item:active{cursor:grabbing;transform:translateX(0) scale(.98)}
.pal-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px currentColor}
.pal-icon svg{width:22px;height:22px}
.pal-label{font-size:.77rem;color:var(--text);line-height:1.2;font-weight:500}
.pal-sub{font-size:.67rem;color:var(--muted)}
/* ── Canvas ── */
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 50% 0%, rgba(0,217,255,.05), transparent 55%),
  var(--bg)}
#canvas-svg{width:100%;height:100%;cursor:default}
.grid-bg{fill:url(#grid-pattern)}
.canvas-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted);background:rgba(22,27,34,.85);backdrop-filter:blur(4px);border:1px solid var(--border);padding:5px 14px;border-radius:20px;pointer-events:none;transition:opacity .3s;box-shadow:var(--shadow-sm)}
/* Node styles */
.node{cursor:move;user-select:none}
.node-body{transition:filter .15s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.node:hover .node-body{filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))}
.node.selected .node-body{filter:drop-shadow(0 0 9px currentColor)}
.node.selected .node-ring{stroke-opacity:1!important}
.node-ring{fill:none;stroke-opacity:0;transition:stroke-opacity .15s}
.node-label-bg{fill:#0d1117;opacity:.72;pointer-events:none}
.anchor{cursor:crosshair;opacity:0;transition:opacity .2s;pointer-events:all}
.node:hover .anchor,.node.selected .anchor{opacity:1}
/* Ícone: leve brilho na cor do device, mais forte no hover/seleção */
.node-icon{filter:drop-shadow(0 0 2px currentColor);transition:filter .15s}
.node:hover .node-icon{filter:drop-shadow(0 0 5px currentColor)}
.node.selected .node-icon{filter:drop-shadow(0 0 7px currentColor)}
/* Anel pulsante — só em nodes vinculados a um Acesso do CRM (node.acesso_id),
   indicando visualmente "equipamento real monitorado" vs. desenho manual.
   !important da seleção (acima) sempre vence a animação quando selecionado. */
@keyframes pulse-ring{0%,100%{stroke-opacity:.12}50%{stroke-opacity:.55}}
.node[data-live="1"] .node-ring{animation:pulse-ring 2.6s ease-in-out infinite}
body.effects-off .node[data-live="1"] .node-ring{animation:none}
/* Link styles */
.link{fill:none;stroke-width:2.5;cursor:pointer;transition:stroke-opacity .15s,filter .15s}
.link:hover{filter:brightness(1.25)}
.link.selected{stroke-width:3.5;filter:drop-shadow(0 0 4px currentColor)}
.link-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
/* Fluxo animado — tracinhos que "correm" do Lado A pro Lado B, dando a
   sensação de tráfego passando pelo link. Puramente decorativo (sem
   pointer-events, não interfere no clique nem no modelo de dados). */
.link-flow{fill:none;pointer-events:none;stroke-dasharray:5 11;opacity:.6;animation:link-flow 1.1s linear infinite}
@keyframes link-flow{to{stroke-dashoffset:-16}}
body.effects-off .link-flow{display:none}
/* "Pacotes" viajando pelo link (<animateMotion>, ver _renderLink) — o brilho
   dá a impressão de um pulso de luz/dado passando, tipo tráfego de verdade. */
.link-packet{pointer-events:none;filter:drop-shadow(0 0 3px currentColor)}
body.effects-off .link-packet{display:none}
.link-label-bg{fill:var(--surface);rx:4}
.link-label{font-size:10px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.link-arrow{overflow:visible}
/* Connect preview */
#connect-preview{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 4;pointer-events:none;opacity:.7}
/* Multi-seleção (laço de área / shift+clique) e arrasto em grupo */
.node.multi-selected .node-body{filter:drop-shadow(0 0 9px var(--cyan))}
.node.multi-selected .node-ring{stroke:var(--cyan)!important;stroke-opacity:1!important;stroke-dasharray:4 2}
#rubber-band{fill:rgba(0,217,255,.08);stroke:var(--cyan);stroke-width:1;stroke-dasharray:4 3;pointer-events:none}
/* ── Properties panel ── */
#props{width:250px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#props-content{padding:14px;flex:1}
.prop-title{font-size:.8rem;color:var(--cyan);font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#props-body{animation:props-fade .15s ease-out}
@keyframes props-fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.prop-group{margin-bottom:14px}
.prop-label{font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block;font-weight:600;letter-spacing:.02em}
.prop-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:.8rem;outline:none;transition:border-color .15s,box-shadow .15s}
.prop-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,217,255,.12)}
.prop-select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:.8rem;outline:none;transition:border-color .15s,box-shadow .15s}
.prop-select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,217,255,.12)}
.prop-row{display:flex;gap:6px}
.prop-row .prop-input{flex:1}
.prop-btn{width:100%;padding:8px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:.78rem;font-weight:500;margin-top:6px;transition:all .15s}
.prop-btn:hover{background:rgba(0,217,255,.1);border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.prop-btn:active{transform:translateY(0)}
.prop-btn.danger:hover{background:rgba(248,81,73,.1);border-color:var(--red);color:var(--red)}
.prop-btn.primary{background:var(--accent-grad);border-color:transparent;color:#04121a;font-weight:700;box-shadow:0 2px 10px rgba(0,217,255,.2)}
.prop-btn.primary:hover{filter:brightness(1.08);color:#04121a}
.iface-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:.65rem;font-weight:700;margin:2px}
/* ── Status bar ── */
#statusbar{height:26px;background:#0a0f14;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:.7rem;color:var(--muted);gap:16px;flex-shrink:0}
#statusbar span{display:flex;align-items:center;gap:4px}
/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:380px;max-width:92vw;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-title{font-size:1rem;font-weight:700;color:var(--cyan);margin-bottom:16px}
.modal-footer{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-ok{flex:1;padding:8px;background:rgba(63,185,80,.15);border:1px solid var(--green);color:var(--green);border-radius:6px;cursor:pointer;font-size:.85rem}
.btn-cancel{flex:1;padding:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer;font-size:.85rem}
/* Link IP labels */
.link-ip{font-size:9px;fill:#ffffff;font-weight:700;text-anchor:middle;font-family:'Courier New',monospace;pointer-events:none}
/* Link interface labels (lado A/B) */
.link-iface{font-size:8px;text-anchor:middle;font-family:'Courier New',monospace;pointer-events:none;font-weight:600;opacity:.9}
/* Text box node */
.text-box-node .node-body{fill:transparent!important;stroke-dasharray:5,3;filter:none}
.text-box-node .node-ring{display:none}
.text-box-node .anchor{opacity:0}
.text-box-node:hover .anchor{opacity:1}
/* Toast */
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(6px);background:#161b22;border:1px solid var(--green);color:var(--green);padding:9px 20px;border-radius:20px;font-size:.82rem;z-index:200;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:var(--shadow-md)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Waypoint handles */
.wp-handle{pointer-events:all}
.wp-pt{cursor:move}
.wp-mid{cursor:crosshair;opacity:.7;transition:opacity .15s}
.wp-mid:hover{opacity:1;r:7}
/* Legenda de interfaces */
#legend-panel{position:absolute;bottom:8px;left:8px;background:rgba(22,27,34,.92);backdrop-filter:blur(4px);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.7rem;color:var(--muted);box-shadow:var(--shadow-md);max-width:200px;display:none}
#legend-panel.show{display:block}
#legend-panel .legend-title{font-size:.68rem;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#legend-panel .legend-close{cursor:pointer;opacity:.6;transition:opacity .15s}
#legend-panel .legend-close:hover{opacity:1;color:var(--red)}
#legend-panel .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
#legend-panel .legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
#legend-panel .legend-swatch{width:14px;height:3px;border-radius:2px;flex-shrink:0}
/* Scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
</style>
</head>
<body>
{% csrf_token %}
<div id="toolbar">
  <div class="tb-brand"><i class="fas fa-diagram-project"></i> Topologia</div>
  <input id="nome-diagrama" value="{{ diagrama.nome|default:'Nova Topologia' }}" title="Nome do diagrama (clique para editar)">
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="topo.save()" title="Salvar (Ctrl+S)"><i class="fas fa-save"></i> Salvar</button>
  <button class="tb-btn" onclick="topo.importHosts()" title="Importar hosts do CRM"><i class="fas fa-cloud-download-alt"></i> Importar Hosts</button>
<button class="tb-btn" onclick="topo.exportPNG()" title="Exportar PNG"><i class="fas fa-image"></i> PNG</button>
  <button class="tb-btn" onclick="topo.undo()" title="Desfazer (Ctrl+Z)"><i class="fas fa-undo"></i></button>
  <button class="tb-btn" onclick="topo.redo()" title="Refazer (Ctrl+Y)"><i class="fas fa-redo"></i></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-grid" onclick="topo.toggleGrid()" title="Toggle grid"><i class="fas fa-th"></i> Grid</button>
  <button class="tb-btn" id="btn-snap" onclick="topo.toggleSnap()" title="Snap ao grid"><i class="fas fa-magnet"></i> Snap</button>
  <button class="tb-btn" id="btn-connect" onclick="topo.toggleConnectMode()" title="Modo conexão (C)"><i class="fas fa-project-diagram"></i> Conectar</button>
  <button class="tb-btn" id="btn-area-select" onclick="topo.toggleAreaSelect()" title="Seleção de área — arraste para selecionar vários dispositivos (atalho: segurar Shift e arrastar)"><i class="fas fa-vector-square"></i> Área</button>
  <button class="tb-btn" id="btn-legend" onclick="topo.toggleLegend()" title="Legenda de interfaces"><i class="fas fa-list"></i> Legenda</button>
  <button class="tb-btn" id="btn-effects" onclick="topo.toggleEffects()" title="Efeitos visuais (fluxo animado nos links, pulso nos nodes do CRM)"><i class="fas fa-bolt"></i> Efeitos</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="topo.zoomFit()" title="Ajustar zoom"><i class="fas fa-expand-arrows-alt"></i></button>
  <button class="tb-btn" onclick="topo.zoomIn()"><i class="fas fa-search-plus"></i></button>
  <button class="tb-btn" onclick="topo.zoomOut()"><i class="fas fa-search-minus"></i></button>
  <div class="tb-right">
    <span class="tb-cliente"><i class="fas fa-building"></i> {{ cliente.nome_empresa }}</span>
    <button class="tb-btn" id="btn-fechar" onclick="window.close()"><i class="fas fa-times"></i> Fechar</button>
  </div>
</div>

<div id="main">
  <!-- Palette -->
  <div id="palette">
    <div class="pal-title"><i class="fas fa-cubes"></i>Dispositivos</div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <svg id="canvas-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Grid "blueprint": pontos finos a cada 20px + linhas discretas a
             cada 100px (5 células), num único pattern — dá a mesma sensação
             de grade técnica de ferramentas profissionais de diagrama sem
             exigir um segundo <rect>/estado no JS (toggleGrid() já esconde
             tudo isso de uma vez, escondendo só o #grid-bg). -->
        <pattern id="grid-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100,0 L0,0 0,100" fill="none" stroke="#1a1f28" stroke-width="1"/>
          <circle cx="10" cy="10" r=".7" fill="#21262d"/><circle cx="30" cy="10" r=".7" fill="#21262d"/><circle cx="50" cy="10" r=".7" fill="#21262d"/><circle cx="70" cy="10" r=".7" fill="#21262d"/><circle cx="90" cy="10" r=".7" fill="#21262d"/>
          <circle cx="10" cy="30" r=".7" fill="#21262d"/><circle cx="30" cy="30" r=".7" fill="#21262d"/><circle cx="50" cy="30" r=".7" fill="#21262d"/><circle cx="70" cy="30" r=".7" fill="#21262d"/><circle cx="90" cy="30" r=".7" fill="#21262d"/>
          <circle cx="10" cy="50" r=".7" fill="#21262d"/><circle cx="30" cy="50" r=".7" fill="#21262d"/><circle cx="50" cy="50" r=".7" fill="#21262d"/><circle cx="70" cy="50" r=".7" fill="#21262d"/><circle cx="90" cy="50" r=".7" fill="#21262d"/>
          <circle cx="10" cy="70" r=".7" fill="#21262d"/><circle cx="30" cy="70" r=".7" fill="#21262d"/><circle cx="50" cy="70" r=".7" fill="#21262d"/><circle cx="70" cy="70" r=".7" fill="#21262d"/><circle cx="90" cy="70" r=".7" fill="#21262d"/>
          <circle cx="10" cy="90" r=".7" fill="#21262d"/><circle cx="30" cy="90" r=".7" fill="#21262d"/><circle cx="50" cy="90" r=".7" fill="#21262d"/><circle cx="70" cy="90" r=".7" fill="#21262d"/><circle cx="90" cy="90" r=".7" fill="#21262d"/>
        </pattern>
        <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
        </marker>
        <!-- Sheen sutil no topo dos nodes (ver _renderNode em topo_main.js) —
             gradiente (não um retângulo sólido) pra sumir sem deixar uma
             borda dura no meio do node. -->
        <linearGradient id="node-gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".12"/>
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect id="grid-bg" width="20000" height="20000" x="-10000" y="-10000" class="grid-bg"/>
      <g id="viewport">
        <path id="connect-preview" d="" style="display:none"/>
        <g id="links-layer"></g>
        <g id="nodes-layer"></g>
        <rect id="rubber-band" x="0" y="0" width="0" height="0" style="display:none"/>
      </g>
    </svg>
    <div id="legend-panel"></div>
    <div class="canvas-hint" id="canvas-hint" style="display:none">
      <i class="fas fa-hand-pointer" style="margin-right:6px;color:var(--cyan)"></i>Arraste um dispositivo da paleta ou clique em "Importar Hosts" para começar
    </div>
    <div style="position:absolute;bottom:8px;right:8px;font-size:.7rem;color:var(--muted);background:rgba(13,17,23,.8);padding:4px 10px;border-radius:8px" id="zoom-label">100%</div>
  </div>

  <!-- Properties -->
  <div id="props">
    <div id="props-content">
      <div class="prop-title"><i class="fas fa-sliders-h"></i> Propriedades</div>
      <div id="props-body" style="color:var(--muted);font-size:.8rem;text-align:center;padding-top:40px">
        <i class="fas fa-mouse-pointer" style="font-size:2rem;margin-bottom:12px;display:block;opacity:.3"></i>
        Selecione um dispositivo<br>ou conexão
      </div>
    </div>
  </div>
</div>

<div id="statusbar">
  <span><i class="fas fa-circle" style="color:var(--green)"></i> <span id="st-nodes">0</span> dispositivos</span>
  <span><i class="fas fa-project-diagram"></i> <span id="st-links">0</span> conexões</span>
  <span id="st-mode">Modo: Seleção</span>
  <span id="st-save" style="margin-left:auto"></span>
</div>

<div id="toast"></div>
<script>
  window.TOPO_CLIENTE_ID  = {{ cliente.id }};
  window.TOPO_DIAGRAMA_ID = {{ diagrama_id|default:'null' }};
  window.TOPO_DADOS = JSON.parse("{{ dados_json|escapejs }}");
  if (new URLSearchParams(window.location.search).get('embed') === '1') {
    document.body.classList.add('embed-mode');
  }
</script>
<script src="/static/js/topo_engine.js?v=23"></script>
<script src="/static/js/topo_main.js?v=25"></script>
</body>
</html>
