<label class="modulo-toggle-switch"
       title="{% if habilitado %}Módulo contratado — clique para desabilitar para este cliente{% else %}Módulo não contratado — clique para habilitar para este cliente{% endif %}"
       onclick="event.stopPropagation()">
    <input type="checkbox"
           class="modulo-toggle-input"
           data-modulo="{{ modulo }}"
           {% if habilitado %}checked{% endif %}
           onchange="toggleModuloCliente(this)">
    <span class="modulo-toggle-slider"></span>
</label>
