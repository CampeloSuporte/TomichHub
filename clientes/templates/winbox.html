<!DOCTYPE html>
<html lang="pt-BR">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ acesso.host }}</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }

        #vnc-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Overlay de status - aparece apenas durante conexao, some depois */
        #wb-status {
            position: fixed;
            top: 10px; right: 14px;
            display: flex; align-items: center; gap: 7px;
            padding: 5px 11px;
            background: rgba(10,10,10,0.82);
            border: 1px solid #333;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 11px; color: #aaa;
            z-index: 100;
            transition: opacity 0.6s;
            pointer-events: none;
        }
        #wb-status.hidden { opacity: 0; }
        .wb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .status-connecting .wb-dot { background: #d29922; animation: blink 1s infinite; }
        .status-connected  .wb-dot { background: #3fb950; }
        .status-error      .wb-dot { background: #f85149; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        /* Splash de carregamento */
        #wb-splash {
            position: fixed; inset: 0;
            background: #0a0a0a;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            z-index: 200;
            transition: opacity 0.5s;
        }
        #wb-splash.hidden { opacity: 0; pointer-events: none; }
        .splash-ring {
            width: 44px; height: 44px;
            border: 3px solid #222;
            border-top-color: #d29922;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .splash-title { font-family: monospace; font-size: 13px; color: #d29922; font-weight: 700; }
        .splash-sub   { font-family: monospace; font-size: 11px; color: #555; }

        canvas { outline: none; display: block; }

        /* Botao + painel de clipboard (copiar/colar entre o PC local e a sessao remota) */
        #wb-clip-btn {
            position: fixed;
            bottom: 14px; right: 14px;
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10,10,10,0.82);
            border: 1px solid #333;
            border-radius: 8px;
            color: #aaa;
            font-size: 17px;
            cursor: pointer;
            z-index: 150;
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }
        #wb-clip-btn:hover { background: rgba(30,30,30,0.9); color: #d29922; }
        #wb-clip-btn.ativo { color: #d29922; border-color: #d29922; }

        #wb-clip-panel {
            position: fixed;
            bottom: 60px; right: 14px;
            width: 300px;
            background: rgba(15,15,15,0.96);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            z-index: 150;
            display: none;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }
        #wb-clip-panel.aberto { display: block; }
        #wb-clip-panel .wb-clip-titulo {
            font-size: 11px; color: #d29922; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        #wb-clip-panel textarea {
            width: 100%; height: 90px; resize: vertical;
            background: #0a0a0a; color: #ddd;
            border: 1px solid #333; border-radius: 4px;
            font-family: inherit; font-size: 12px; padding: 6px;
            outline: none;
        }
        #wb-clip-panel textarea:focus { border-color: #d29922; }
        #wb-clip-panel .wb-clip-dica {
            font-size: 10px; color: #666; margin-top: 6px; line-height: 1.4;
        }
        #wb-clip-panel .wb-clip-colar {
            width: 100%; margin-top: 7px; padding: 6px;
            background: #1a1a1a; color: #d29922;
            border: 1px solid #d29922; border-radius: 4px;
            font-family: inherit; font-size: 11px; cursor: pointer;
        }
        #wb-clip-panel .wb-clip-colar:hover { background: #d29922; color: #0a0a0a; }

        /* Alvo invisivel que recebe o evento "paste" do navegador (ver o bloco
           de Ctrl+V no script). Precisa ser focavel de verdade: display:none ou
           visibility:hidden nao recebem foco e o paste nunca chegaria. */
        #wb-paste-sink {
            position: fixed; top: 0; left: -9999px;
            width: 1px; height: 1px;
            opacity: 0; border: 0; padding: 0;
            pointer-events: none;
        }
    </style>
    <script type="module">
        import RFB from '{% static "novnc/core/rfb.js" %}';
        import KeyTable from '{% static "novnc/core/input/keysym.js" %}';

        const acessoId = "{{ acesso.id }}";
        const vncMode  = "{{ vnc_mode|default:'winbox' }}";
        const _up = new URLSearchParams(location.search);
        // Xvfb é criado em pixels CSS, não físicos — em telas HiDPI (Retina, Windows
        // com escala >100%) isso deixava o framebuffer com metade (ou 1/3) da resolução
        // real e o noVNC esticava via CSS, borrando texto/ícones. Multiplicamos pelo
        // devicePixelRatio (cap em 2x pra não estourar CPU/gravação em telas 3x) pra
        // renderizar em resolução física e o scaleViewport reduzir de volta com nitidez.
        const _dpr = Math.min(window.devicePixelRatio || 1, 2);
        const _initW = parseInt(_up.get('w')) || Math.round(document.documentElement.clientWidth * _dpr);
        const _initH = parseInt(_up.get('h')) || Math.round(document.documentElement.clientHeight * _dpr);
        const _winboxVersion = _up.get('v') === '3' ? '3' : '4';
        let rfb;

        function setStatus(cls, txt) {
            const el = document.getElementById('wb-status');
            el.className = cls;
            el.querySelector('#wb-status-txt').textContent = txt;
        }

        function initVNC() {
            setStatus('status-connecting', 'Conectando...');

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = proto + '//' + location.host + '/ws/vnc/' + acessoId + '/?mode=' + vncMode + '&v=' + _winboxVersion + '&w=' + _initW + '&h=' + _initH;
            const container = document.getElementById('vnc-container');

            rfb = new RFB(container, wsUrl, {
                credentials: { password: '' },
                wsProtocols: ['binary'],
            });

            rfb.scaleViewport  = true;   // escala client-side
            rfb.resizeSession  = false;  // Xvfb ja criado com dimensoes corretas; resize dinamico desmaximiza o WinBox
            rfb.background     = '#000';
            rfb.qualityLevel   = 8;      // JPEG quase sem perda (0-9) — texto/icones nitidos
            rfb.compressionLevel = 4;    // equilibrio CPU x banda com a qualidade maior acima

            rfb.addEventListener('connect', () => {
                setStatus('status-connected', 'Conectado');
                document.getElementById('wb-splash').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('wb-status').classList.add('hidden');
                }, 2000);
                // Envia tamanho real ao servidor VNC (com fallback se ainda 0)
                function sendSize() {
                    const w = Math.round(document.documentElement.clientWidth * _dpr);
                    const h = Math.round(document.documentElement.clientHeight * _dpr);
                    if (w > 0 && h > 0) {
                        try { rfb._sendDesktopSize && rfb._sendDesktopSize(w, h); } catch(_) {}
                    }
                }
                sendSize();
                // Tenta novamente apos layout estabilizar (caso iframe ainda sem dimensoes)
                setTimeout(sendSize, 300);
                setTimeout(sendSize, 800);
                setTimeout(sendSize, 1500);
            });

            // ── Clipboard local <-> sessao remota ──
            // rfb.clipboardPasteFrom(texto) manda o texto pro "clipboard" X11
            // dentro da sessao (via ClientCutText); o evento "clipboard" do RFB
            // dispara quando algo e copiado LA DENTRO (ServerCutText do x11vnc).
            // Continua precisando de um Ctrl+V manual dentro da janela remota —
            // isso so garante que o texto certo esteja esperando la.
            rfb.addEventListener('clipboard', (e) => {
                const ta = document.getElementById('wb-clip-text');
                ta.value = e.detail.text;
                // Espelha no clipboard do SO tambem, quando o navegador permitir,
                // pra colar direto fora do navegador sem precisar copiar do painel.
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(e.detail.text).catch(() => {});
                }
                abrirPainelClipboard();
            });

            rfb.addEventListener('disconnect', () => {
                setStatus('status-error', 'Desconectado');
                document.getElementById('wb-status').classList.remove('hidden');
                const sp = document.getElementById('wb-splash');
                sp.classList.remove('hidden');
                sp.querySelector('.splash-ring').style.display = 'none';
                sp.querySelector('.splash-title').textContent  = 'Sessao Encerrada';
                sp.querySelector('.splash-sub').textContent    = 'A conexao foi perdida.';
            });

            // Re-envia resolucao ao redimensionar a janela
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const w = Math.round(document.documentElement.clientWidth * _dpr);
                    const h = Math.round(document.documentElement.clientHeight * _dpr);
                    if (rfb && w > 0 && h > 0) {
                        try { rfb._sendDesktopSize && rfb._sendDesktopSize(w, h); } catch(_) {}
                    }
                }, 250);
            });
        }

        // ── Colar do PC local dentro da sessao (Ctrl+V / Shift+Insert) ──
        // O canvas do noVNC so encaminha a TECLA pro host remoto — quem cola e o
        // app la dentro, contra o clipboard X11 da sessao. Entao, antes do Ctrl+V
        // chegar no app remoto, precisamos empurrar o texto do PC local pro
        // clipboard da sessao (ClientCutText, via rfb.clipboardPasteFrom).
        //
        // A leitura do clipboard local sai do evento "paste" do proprio navegador,
        // NAO de navigator.clipboard.readText(): o evento nao pede permissao
        // nenhuma e existe em todos os navegadores, enquanto readText() nunca
        // existiu no Firefox e no Chrome pode estar negado — era exatamente por
        // isso que colar algo de fora dentro da renderizacao nao fazia nada.
        // O truque e mover o foco pra um <textarea> invisivel ainda dentro do
        // keydown: o navegador entrega o "paste" nele e lemos o conteudo dali.
        //
        // IMPORTANTE: nao chamar preventDefault() nesse keydown — o evento
        // "paste" e a acao padrao dele, e cancelar mataria justamente essa via.
        //
        // Depois que o texto entra no clipboard da sessao, sintetizamos o Ctrl+V
        // pro app remoto. O atraso da tempo do x11vnc assumir a selecao X11 e,
        // no RDP, do FreeRDP negociar o cliprdr com o Windows antes do paste.
        const _pasteDelay = vncMode === 'rdp' ? 250 : 80;
        let _pasteArmado = false;
        let _pasteTimer  = null;

        function _focarSessao() {
            try { rfb && rfb.focus(); } catch (_) {}
        }

        function _enviarCtrlVRemoto() {
            if (!rfb) return;
            // Sintetiza o Ctrl+V inteiro, incluindo o proprio Control: durante a
            // espera o Ctrl fisico pode ja ter sido solto, e o noVNC ignora
            // release de tecla que ele nao registrou como pressionada.
            rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', true);
            rfb.sendKey(KeyTable.XK_v, 'KeyV', true);
            rfb.sendKey(KeyTable.XK_v, 'KeyV', false);
            rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', false);
        }

        function colarNaSessao(texto) {
            if (!rfb) return;
            // Clipboard local vazio (ou ilegivel): ainda assim reenvia a tecla que
            // seguramos no keydown, pra colar o que ja estiver no clipboard da
            // sessao em vez de o Ctrl+V do usuario simplesmente sumir.
            if (!texto) { _enviarCtrlVRemoto(); return; }
            rfb.clipboardPasteFrom(texto);
            const ta = document.getElementById('wb-clip-text');
            if (ta) ta.value = texto;
            setTimeout(_enviarCtrlVRemoto, _pasteDelay);
        }

        function _armarCapturaDeColagem() {
            const sink = document.getElementById('wb-paste-sink');
            sink.value = '';
            _pasteArmado = true;
            try { sink.focus({ preventScroll: true }); } catch (_) { sink.focus(); }

            // Devolve o foco pro canvas assim que a acao padrao do keydown (o
            // "paste") terminar de ser despachada — se o foco ficasse no sink, o
            // keyup do Ctrl nao chegaria no noVNC e o modificador ficaria preso
            // na sessao remota.
            setTimeout(_focarSessao, 0);

            clearTimeout(_pasteTimer);
            // Plano B: se o "paste" nao chegar (navegador bloqueou a acao padrao),
            // tenta a API assincrona, que exige permissao mas e melhor que nada.
            _pasteTimer = setTimeout(() => {
                if (!_pasteArmado) return;
                _pasteArmado = false;
                if (navigator.clipboard && navigator.clipboard.readText) {
                    navigator.clipboard.readText()
                        .then(colarNaSessao)
                        .catch(() => _enviarCtrlVRemoto());
                } else {
                    _enviarCtrlVRemoto();
                }
            }, 150);
        }

        document.addEventListener('keydown', (ev) => {
            if (!rfb) return;
            const ehColar =
                ((ev.ctrlKey || ev.metaKey) && !ev.altKey &&
                 (ev.code === 'KeyV' || ev.key === 'v' || ev.key === 'V')) ||
                (ev.shiftKey && !ev.ctrlKey && ev.code === 'Insert');
            if (!ehColar) return;
            // No textarea do painel manual, deixa o colar nativo do navegador agir.
            if (ev.target && ev.target.id === 'wb-clip-text') return;

            // Segura a tecla: se ela chegasse agora no app remoto, ele colaria o
            // conteudo antigo do clipboard da sessao. Ela e reenviada por
            // colarNaSessao() depois que o texto novo estiver la.
            ev.stopPropagation();
            ev.stopImmediatePropagation();
            _armarCapturaDeColagem();
        }, true);

        document.addEventListener('paste', (ev) => {
            if (!_pasteArmado) return;  // colagem dentro do painel manual segue normal
            _pasteArmado = false;
            clearTimeout(_pasteTimer);
            ev.preventDefault();
            const dados = ev.clipboardData || window.clipboardData;
            _focarSessao();
            colarNaSessao(dados ? dados.getData('text/plain') : '');
        }, true);

        // ── Painel de clipboard ──
        function abrirPainelClipboard() {
            document.getElementById('wb-clip-panel').classList.add('aberto');
            document.getElementById('wb-clip-btn').classList.add('ativo');
        }
        function fecharPainelClipboard() {
            document.getElementById('wb-clip-panel').classList.remove('aberto');
            document.getElementById('wb-clip-btn').classList.remove('ativo');
        }
        function toggleClipboard() {
            const painel = document.getElementById('wb-clip-panel');
            if (painel.classList.contains('aberto')) {
                fecharPainelClipboard();
            } else {
                abrirPainelClipboard();
                // Tenta pre-preencher com o clipboard do SO (navegador pode negar
                // sem gesto do usuario; o clique no botao ja conta como gesto).
                if (navigator.clipboard && navigator.clipboard.readText) {
                    navigator.clipboard.readText().then(txt => {
                        const ta = document.getElementById('wb-clip-text');
                        if (txt) ta.value = txt;
                        ta.focus(); ta.select();
                    }).catch(() => document.getElementById('wb-clip-text').focus());
                } else {
                    document.getElementById('wb-clip-text').focus();
                }
            }
        }
        function enviarClipboardParaSessao() {
            const texto = document.getElementById('wb-clip-text').value;
            if (rfb) rfb.clipboardPasteFrom(texto);
        }
        // Botao do painel: alem de mandar o texto, dispara o Ctrl+V dentro da
        // sessao — util quando o navegador bloqueia a leitura do clipboard e o
        // usuario digita/cola o texto no painel na mao.
        function colarPainelNaSessao() {
            const texto = document.getElementById('wb-clip-text').value;
            _focarSessao();
            colarNaSessao(texto);
            fecharPainelClipboard();
        }
        window.toggleClipboard = toggleClipboard;
        window.fecharPainelClipboard = fecharPainelClipboard;
        window.enviarClipboardParaSessao = enviarClipboardParaSessao;
        window.colarPainelNaSessao = colarPainelNaSessao;

        document.addEventListener('DOMContentLoaded', () => {
            initVNC();
            // Colar direto (Ctrl+V) manda o texto pro clipboard remoto sem precisar
            // abrir o painel — so funciona quando o painel/textarea esta com foco
            // (colar com o canvas focado ja e roteado como tecla pra sessao).
            document.getElementById('wb-clip-text').addEventListener('input', enviarClipboardParaSessao);
        });
    </script>
</head>
<body>
    <!-- Badge de status (overlay) -->
    <div id="wb-status" class="status-connecting">
        <div class="wb-dot"></div>
        <span id="wb-status-txt">Iniciando...</span>
    </div>

    <!-- Splash de carregamento -->
    <div id="wb-splash">
        <div class="splash-ring"></div>
        <div class="splash-title">Preparando WinBox</div>
        <div class="splash-sub">Criando sessao segura...</div>
    </div>

    <!-- Canvas noVNC - ocupa 100% da tela -->
    <div id="vnc-container"></div>

    <!-- Clipboard: copiar/colar entre o PC local e a sessao remota -->
    <div id="wb-clip-btn" onclick="toggleClipboard()" title="Área de transferência">📋</div>
    <div id="wb-clip-panel">
        <div class="wb-clip-titulo">
            <span>ÁREA DE TRANSFERÊNCIA</span>
            <span style="cursor:pointer;color:#666" onclick="fecharPainelClipboard()">✕</span>
        </div>
        <textarea id="wb-clip-text" placeholder="Cole aqui (Ctrl+V) para enviar à sessão remota, ou o texto copiado lá dentro aparece aqui..."></textarea>
        <button class="wb-clip-colar" onclick="colarPainelNaSessao()">Colar na sessão</button>
        <div class="wb-clip-dica">Normalmente basta dar Ctrl+V direto na tela remota. Este painel é a alternativa manual: o que for copiado lá dentro também aparece aqui.</div>
    </div>

    <!-- Alvo invisível do evento "paste" do navegador (ver script) -->
    <textarea id="wb-paste-sink" tabindex="-1" aria-hidden="true"></textarea>
</body>
</html>
