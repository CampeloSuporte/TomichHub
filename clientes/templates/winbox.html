<!DOCTYPE html>
<html lang="pt-BR">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinBox Web — {{ acesso.tipo }} {{ acesso.host }}</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #0a0a0a;
            --bg2:       #111111;
            --bg3:       #1a1a1a;
            --border:    #222;
            --cyan:      #00d9ff;
            --green:     #00ff88;
            --red:       #ff4444;
            --orange:    #ffa500;
            --text:      #e2e8f0;
            --muted:     #475569;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            overflow: hidden;
        }

        .wb-wrapper {
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
        }

        .wb-toolbar {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 14px;
            background: var(--bg2);
            border-bottom: 2px solid var(--orange);
            flex-shrink: 0; min-height: 48px;
        }

        .wb-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .wb-logo svg { width: 22px; height: 22px; }
        .wb-logo-text { font-size: 13px; font-weight: 700; color: var(--orange); letter-spacing: 1px; }

        .wb-separator { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

        .wb-device-info { display: flex; align-items: center; gap: 8px; flex: 1; }
        .wb-device-host { color: var(--orange); font-size: 12px; font-weight: 700; }
        .wb-device-type { color: var(--muted); font-size: 11px; }

        .wb-status { display: flex; align-items: center; gap: 6px; font-size: 11px; }
        .wb-status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .wb-status.connecting .wb-status-dot { background: var(--orange); animation: pulse 1s infinite; }
        .wb-status.connected .wb-status-dot { background: var(--green); }
        .wb-status.error .wb-status-dot { background: var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .wb-actions { display: flex; gap: 6px; }
        .wb-btn {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            padding: 5px 12px; border-radius: 3px; cursor: pointer;
            font-family: var(--font-mono); font-size: 11px; transition: all .2s;
        }
        .wb-btn:hover { border-color: var(--orange); color: var(--orange); }

        .wb-body { flex: 1; position: relative; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        
        #vnc-container {
            width: 100%; height: 100%;
        }

        .wb-splash {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; background: var(--bg); z-index: 10;
            transition: opacity 0.5s;
        }
        .wb-splash.hidden { opacity: 0; pointer-events: none; }

        .wb-splash-ring {
            width: 48px; height: 48px; border: 3px solid var(--border);
            border-top-color: var(--orange); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .wb-splash-msg h2 { font-size: 14px; font-weight: 700; color: var(--orange); margin-bottom: 8px; text-align: center; }
        .wb-splash-msg p { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.8; }
        
        canvas { outline: none; }
    </style>
    <!-- Importar noVNC via módulo ES do CDN jsdelivr -->
    <script type="module">
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';

        let rfb;
        const acessoId = "{{ acesso.id }}";
        
        function setStatus(cls, txt) {
            const el = document.getElementById('wbStatus');
            el.className = 'wb-status ' + cls;
            document.getElementById('wbStatusText').textContent = txt;
        }

        function initVNC() {
            setStatus('connecting', 'Conectando VNC...');
            
            // Usar wss:// se for https, senão ws://
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const vncMode = "{{ vnc_mode|default:'winbox' }}";
            const wsUrl = `${protocol}//${window.location.host}/ws/vnc/${acessoId}/?mode=${vncMode}`;

            
            // Instanciar RFB (noVNC)
            rfb = new RFB(document.getElementById('vnc-container'), wsUrl, {
                credentials: { password: '' } // x11vnc rodando sem senha
            });
            
            // Fazer o Canvas preencher e escalar na tela do navegador
            rfb.scaleViewport = true;
            rfb.background = '#0a0a0a';
            rfb.resizeSession = true; // Se o servidor suportar, altera a resolução remotamente

            rfb.addEventListener('connect', () => {
                setStatus('connected', 'Conectado');
                document.getElementById('wbSplash').classList.add('hidden');
            });

            rfb.addEventListener('disconnect', (e) => {
                setStatus('error', 'Desconectado');
                document.getElementById('wbSplash').classList.remove('hidden');
                document.getElementById('wbSplashTitle').innerText = "Sessão Encerrada";
                document.getElementById('wbSplashDesc').innerText = "A conexão com o servidor foi perdida.";
                document.getElementById('wbRing').style.display = 'none';
            });
            
            // Enviar requisição inicial para ligar o WinBox no servidor
            // Como o RFB tenta conectar assim que instanciado, precisamos garantir
            // que a nossa lógica no VNCConsumer seja ativada.
            // Solução: O VNCConsumer vai ler a string "connect" se for texto, 
            // ou RFB protocol (bytes) se for binário. 
            // O RFB usa binário. Então o VNCConsumer precisa iniciar *automaticamente* no connect() do WebSocket 
            // sem precisar de um JSON explícito.
        }
        
        window.recarregar = function() {
            window.location.reload();
        }

        window.abrirNovaAba = function() {
            window.open(window.location.href, '_blank');
        }

        document.addEventListener('DOMContentLoaded', initVNC);
    </script>
</head>
<body>
<div class="wb-wrapper">
    <div class="wb-toolbar">
        <div class="wb-logo">
            <svg viewBox="0 0 22 22" fill="none">
                <rect width="22" height="22" rx="4" fill="#ffa500" opacity="0.15"/>
                <path d="M4 6h4l3 10 3-10h4" stroke="#ffa500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="wb-logo-text">WinBox</span>
            <span class="wb-logo-version">Web</span>
        </div>
        <div class="wb-separator"></div>
        <div class="wb-device-info">
            <span class="wb-device-host">{{ acesso.host }}</span>
            <span class="wb-device-type">· {{ acesso.tipo }}</span>
        </div>
        <div id="wbStatus" class="wb-status connecting">
            <div class="wb-status-dot"></div>
            <span id="wbStatusText">Iniciando…</span>
        </div>
        <div class="wb-actions">
            <button class="wb-btn" onclick="recarregar()" title="Recarregar">↺ Recarregar</button>
            <button class="wb-btn" onclick="abrirNovaAba()" title="Abrir em nova aba">⤢ Nova aba</button>
        </div>
    </div>
    <div class="wb-body" id="wbBody">
        <div class="wb-splash" id="wbSplash">
            <div class="wb-splash-ring" id="wbRing"></div>
            <div class="wb-splash-msg">
                <h2 id="wbSplashTitle">Preparando Ambiente</h2>
                <p id="wbSplashDesc">Criando sessão segura e renderizando interface gráfica...</p>
            </div>
        </div>
        <div id="vnc-container"></div>
    </div>
</div>
</body>
</html>
