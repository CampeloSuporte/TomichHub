<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Expirado</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.box{text-align:center;padding:48px 32px;background:#161b22;border:1px solid #30363d;border-radius:12px;max-width:440px;width:100%;margin:16px;}
.icon{font-size:3.5rem;margin-bottom:16px;}
h1{font-size:1.3rem;color:#f85149;margin-bottom:8px;}
p{color:#7d8590;font-size:.9rem;line-height:1.6;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">⏰</div>
  <h1>Link expirado</h1>
  <p>Este link de assinatura expirou em {{ contrato.expira_em|date:"d/m/Y H:i" }}.<br>Solicite um novo link ao seu provedor.</p>
</div>
</body>
</html>
