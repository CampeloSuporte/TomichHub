<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>LOA Expirada</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{max-width:440px;width:100%;padding:40px 32px;background:#161b22;border:1px solid #30363d;border-radius:12px;text-align:center;}
.icon{font-size:3rem;margin-bottom:16px;}
h2{color:#d29922;font-size:1.3rem;margin-bottom:10px;}
p{color:#8b949e;font-size:.9rem;line-height:1.6;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">⏰</div>
  <h2>Link Expirado</h2>
  <p>Este link de assinatura da LOA expirou. Solicite ao responsável um novo link pelo sistema.</p>
</div>
</body>
</html>
