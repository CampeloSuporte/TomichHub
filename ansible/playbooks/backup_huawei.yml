---
- name: Backup Huawei
  hosts: all
  gather_facts: no
  vars:
    backup_dir: "{{ backup_dir }}"
  
  tasks:
    - name: Criar diretório de backup
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Backup via SSH Huawei
      expect:
        command: "sshpass -p {{ password }} ssh -o StrictHostKeyChecking=no {{ username }}@{{ host_ip }}"
        responses:
          ".*[>#].*":
            - "display version"
            - "quit"
        timeout: 30
      register: backup_output
      become: no

    - name: Salvar backup localmente
      copy:
        content: "{{ backup_output.stdout }}"
        dest: "{{ backup_dir }}/huawei_{{ device_name }}_{{ ansible_date_time.iso8601_basic_short }}.txt"
      delegate_to: localhost
