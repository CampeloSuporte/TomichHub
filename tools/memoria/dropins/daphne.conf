# Limite de memória do Daphne (proxy web, terminais SSH, WinBox Web, UNM2000).
# 13/11/2026: a VM travou por falta de memória. Com o teto, um vazamento aqui
# derruba só o Daphne (o cgroup mata e o Restart=always religa em 2 s) em vez
# de travar o container inteiro. Normal: ~200 MB; cada UNM2000 Web aberto usa
# até ~1,3 GB (Java -Xmx1024m) e cada WinBox Web ~200 MB.
[Service]
MemoryAccounting=yes
MemoryHigh=6G
MemoryMax=8G
