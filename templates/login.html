{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMICH HUB - Login</title>
    <link href="{% static 'css/css_login.css'%}" rel="stylesheet">
    <style>
        .alert-message {
            background: rgba(255, 50, 50, 0.15);
            border: 1px solid #ff3333;
            color: #ff6666;
            padding: 10px 14px;
            margin-bottom: 16px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            animation: fadeIn 0.3s ease;
        }
        .alert-message.alert-success {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
            color: #00ff88;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>⚡ TOMICH HUB</h1>
                <p>SISTEMA DE ACESSO</p>
            </div>

            <div class="terminal-line">Inicializando conexão segura<span class="cursor">_</span></div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert-message alert-{{ message.tags }}">
                        ⚠ {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form id="loginForm" action="{% url 'login'%}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="usuario">USUÁRIO</label>
                    <input type="text" id="usuario" name="username" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">
                    🔓 ACESSAR SISTEMA
                </button>
            </form>

            <div class="footer-links">
            </div>

            <div class="status-bar">
                STATUS: <span class="status-online">● ONLINE</span> | 
            </div>
        </div>
    </div>

    <script>
        // Matrix rain effect with blue and purple
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]()/*-+@#$%&';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        const colors = ['#8b5cf6', '#00d4ff', '#a855f7', '#0ea5e9', '#7c3aed'];

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 0, 21, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = colors[i % colors.length];
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 35);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Login form — sem e.preventDefault() para não bloquear o POST em caso de erro
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const usuario = document.getElementById('usuario').value;
            const terminalLine = document.querySelector('.terminal-line');

            // Atualiza o terminal mas deixa o form submeter normalmente
            terminalLine.innerHTML = 'Autenticando usuário: ' + usuario + '<span class="cursor">_</span>';
        });
    </script>
</body>
</html>
